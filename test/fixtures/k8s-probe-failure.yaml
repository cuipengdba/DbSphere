apiVersion: v1
kind: Pod
metadata:
  name: dbsphere-probe-failure
  namespace: dbsphere-smoke
  labels:
    app: dbsphere-probe-failure
spec:
  restartPolicy: Never
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: postgres
      image: postgres:18-bookworm
      command: ["sh", "-c", "sleep 3600"]
      readinessProbe:
        exec:
          command: ["sh", "-c", "exit 1"]
        initialDelaySeconds: 1
        periodSeconds: 2
        failureThreshold: 1
