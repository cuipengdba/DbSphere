name: dbsphere-patroni-drill-ci

services:
  store:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: dbsphere
      POSTGRES_DB: dbsphere
      POSTGRES_PASSWORD: ${DBSPHERE_DRILL_STORE_PASSWORD:?Generate the drill env file first}
    volumes:
      - store-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dbsphere -d dbsphere']
      interval: 5s
      timeout: 3s
      retries: 30

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
      - --data-dir=/etcd-data

  patroni1:
    image: ${DBSPHERE_DRILL_PATRONI_IMAGE:-dbsphere/patroni-drill:local}
    build:
      context: ../..
      dockerfile: test/patroni-drill/Dockerfile
      args:
        PG_MAJOR: ${DBSPHERE_DRILL_PG_MAJOR:-18}
    depends_on: [etcd]
    environment:
      PATRONI_NAME: patroni1
      DBSPHERE_DRILL_PG_PASSWORD: ${DBSPHERE_DRILL_PG_PASSWORD:?Generate the drill env file first}
      DBSPHERE_DRILL_REPL_PASSWORD: ${DBSPHERE_DRILL_REPL_PASSWORD:?Generate the drill env file first}
    ports:
      - '127.0.0.1:${DBSPHERE_DRILL_REST_PORT:-18018}:8008'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 36

  patroni2:
    image: ${DBSPHERE_DRILL_PATRONI_IMAGE:-dbsphere/patroni-drill:local}
    depends_on:
      patroni1:
        condition: service_healthy
    environment:
      PATRONI_NAME: patroni2
      DBSPHERE_DRILL_PG_PASSWORD: ${DBSPHERE_DRILL_PG_PASSWORD:?Generate the drill env file first}
      DBSPHERE_DRILL_REPL_PASSWORD: ${DBSPHERE_DRILL_REPL_PASSWORD:?Generate the drill env file first}
    ports:
      - '127.0.0.1:${DBSPHERE_DRILL_SECOND_REST_PORT:-18019}:8008'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 36

  patroni3:
    image: ${DBSPHERE_DRILL_PATRONI_IMAGE:-dbsphere/patroni-drill:local}
    depends_on:
      patroni1:
        condition: service_healthy
    environment:
      PATRONI_NAME: patroni3
      PATRONI_NOSYNC: 'true'
      DBSPHERE_DRILL_PG_PASSWORD: ${DBSPHERE_DRILL_PG_PASSWORD:?Generate the drill env file first}
      DBSPHERE_DRILL_REPL_PASSWORD: ${DBSPHERE_DRILL_REPL_PASSWORD:?Generate the drill env file first}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 36

  proxy:
    image: haproxy:3.2-alpine@sha256:7816a9801a6846b912bc37e48529808e2fa87c3c47992441940f68e393ebcfeb
    depends_on:
      patroni1:
        condition: service_healthy
      patroni2:
        condition: service_healthy
      patroni3:
        condition: service_healthy
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  app:
    image: ${DBSPHERE_DRILL_APP_IMAGE:-dbsphere/patroni-app-drill:local}
    depends_on:
      store:
        condition: service_healthy
      patroni2:
        condition: service_healthy
      patroni3:
        condition: service_healthy
      proxy:
        condition: service_started
    environment:
      DBSPHERE_DATABASE_URL: postgres://dbsphere:${DBSPHERE_DRILL_STORE_PASSWORD}@store:5432/dbsphere?sslmode=disable
      DBSPHERE_ADMIN_PASSWORD: ${DBSPHERE_DRILL_ADMIN_PASSWORD:?Generate the drill env file first}
      DBSPHERE_MASTER_KEY: ${DBSPHERE_DRILL_MASTER_KEY:?Generate the drill env file first}
      DBSPHERE_HOST: 0.0.0.0
      DBSPHERE_PORT: 8080
      DBSPHERE_ENABLE_GO_COLLECTOR: 'false'
    ports:
      - '127.0.0.1:${DBSPHERE_DRILL_APP_PORT:-18097}:8080'

volumes:
  store-data: {}
