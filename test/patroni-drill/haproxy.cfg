defaults
  mode tcp
  timeout connect 2s
  timeout client 30s
  timeout server 30s
  default-server inter 500ms fall 1 rise 1

frontend primary
  bind :5432
  default_backend postgres_primary

frontend standby
  bind :5433
  default_backend postgres_standby

backend postgres_primary
  option httpchk GET /primary
  server patroni1 patroni1:5432 check port 8008
  server patroni2 patroni2:5432 check port 8008
  server patroni3 patroni3:5432 check port 8008

backend postgres_standby
  option httpchk GET /replica
  server patroni1 patroni1:5432 check port 8008
  server patroni2 patroni2:5432 check port 8008
  server patroni3 patroni3:5432 check port 8008
