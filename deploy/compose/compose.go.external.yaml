name: dbsphere-go-dev

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile-go
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DBSPHERE_DATABASE_URL: ${DBSPHERE_DATABASE_URL:?Set an independent PostgreSQL 18 URL in .env.go}
      DBSPHERE_ADMIN_PASSWORD: ${DBSPHERE_ADMIN_PASSWORD:?Run scripts/one-click-go.sh first}
      DBSPHERE_MASTER_KEY: ${DBSPHERE_MASTER_KEY:?Run scripts/one-click-go.sh first}
      DBSPHERE_HOST: 0.0.0.0
      DBSPHERE_PORT: 8080
      DBSPHERE_COOKIE_SECURE: ${DBSPHERE_COOKIE_SECURE:-false}
      DBSPHERE_ENABLE_GO_COLLECTOR: ${DBSPHERE_ENABLE_GO_COLLECTOR:-false}
      DBSPHERE_COLLECT_INTERVAL_SECONDS: ${DBSPHERE_COLLECT_INTERVAL_SECONDS:-60}
    ports:
      - '127.0.0.1:${DBSPHERE_WEB_PORT:-8080}:8080'
