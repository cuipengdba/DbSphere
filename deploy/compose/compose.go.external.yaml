name: dbsphere-go-dev

services:
  app: &go-app
    build:
      context: ../..
      dockerfile: Dockerfile-go
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment: &go-environment
      DBSPHERE_DATABASE_URL: ${DBSPHERE_DATABASE_URL:?Set an independent PostgreSQL 18 URL in .env.go}
      DBSPHERE_ADMIN_PASSWORD: ${DBSPHERE_ADMIN_PASSWORD:?Run scripts/one-click-go.sh first}
      DBSPHERE_VIEWER_PASSWORD: ${DBSPHERE_VIEWER_PASSWORD:-}
      DBSPHERE_APPROVER_PASSWORD: ${DBSPHERE_APPROVER_PASSWORD:-}
      DBSPHERE_WORK_ORDER_TARGETS: ${DBSPHERE_WORK_ORDER_TARGETS:-}
      DBSPHERE_OIDC_ISSUER: ${DBSPHERE_OIDC_ISSUER:-}
      DBSPHERE_OIDC_CLIENT_ID: ${DBSPHERE_OIDC_CLIENT_ID:-}
      DBSPHERE_OIDC_CLIENT_SECRET: ${DBSPHERE_OIDC_CLIENT_SECRET:-}
      DBSPHERE_OIDC_REDIRECT_URL: ${DBSPHERE_OIDC_REDIRECT_URL:-}
      DBSPHERE_OPS_TOKEN: ${DBSPHERE_OPS_TOKEN:-}
      DBSPHERE_OPS_ORGANIZATION: ${DBSPHERE_OPS_ORGANIZATION:-}
      DBSPHERE_OPS_WEBHOOK_URL: ${DBSPHERE_OPS_WEBHOOK_URL:-}
      DBSPHERE_OPS_WEBHOOK_SECRET: ${DBSPHERE_OPS_WEBHOOK_SECRET:-}
      DBSPHERE_METRICS_TOKEN: ${DBSPHERE_METRICS_TOKEN:-}
      DBSPHERE_VIEWER_ASSET_IDS: ${DBSPHERE_VIEWER_ASSET_IDS:-}
      DBSPHERE_AI_DAILY_LIMIT: ${DBSPHERE_AI_DAILY_LIMIT:-20}
      DBSPHERE_AI_AUTO_SUMMARY: ${DBSPHERE_AI_AUTO_SUMMARY:-false}
      DBSPHERE_MASTER_KEY: ${DBSPHERE_MASTER_KEY:?Run scripts/one-click-go.sh first}
      DBSPHERE_HOST: 0.0.0.0
      DBSPHERE_PORT: 8080
      DBSPHERE_REPLICA_NAME: app
      DBSPHERE_COOKIE_SECURE: ${DBSPHERE_COOKIE_SECURE:-false}
      DBSPHERE_ENABLE_GO_COLLECTOR: ${DBSPHERE_ENABLE_GO_COLLECTOR:-false}
      DBSPHERE_COLLECT_INTERVAL_SECONDS: ${DBSPHERE_COLLECT_INTERVAL_SECONDS:-60}
      DBSPHERE_COLLECT_WORKERS: ${DBSPHERE_COLLECT_WORKERS:-4}
      DBSPHERE_PROMETHEUS_URL: ${DBSPHERE_PROMETHEUS_URL:-}
      DBSPHERE_PROMETHEUS_TOKEN: ${DBSPHERE_PROMETHEUS_TOKEN:-}
      DBSPHERE_NOTIFY_MIN_SEVERITY: ${DBSPHERE_NOTIFY_MIN_SEVERITY:-warning}
      DBSPHERE_WEBHOOK_URL: ${DBSPHERE_WEBHOOK_URL:-}
      DBSPHERE_WEBHOOK_SECRET: ${DBSPHERE_WEBHOOK_SECRET:-}
      DBSPHERE_WEBHOOK_MIN_SEVERITY: ${DBSPHERE_WEBHOOK_MIN_SEVERITY:-}
      DBSPHERE_WEBHOOK_ALLOW_HTTP: ${DBSPHERE_WEBHOOK_ALLOW_HTTP:-false}
      DBSPHERE_SMTP_HOST: ${DBSPHERE_SMTP_HOST:-}
      DBSPHERE_SMTP_PORT: ${DBSPHERE_SMTP_PORT:-587}
      DBSPHERE_SMTP_FROM: ${DBSPHERE_SMTP_FROM:-}
      DBSPHERE_SMTP_TO: ${DBSPHERE_SMTP_TO:-}
      DBSPHERE_SMTP_USER: ${DBSPHERE_SMTP_USER:-}
      DBSPHERE_SMTP_PASSWORD: ${DBSPHERE_SMTP_PASSWORD:-}
      DBSPHERE_SMTP_ALLOW_PLAIN: ${DBSPHERE_SMTP_ALLOW_PLAIN:-false}
      DBSPHERE_EMAIL_MIN_SEVERITY: ${DBSPHERE_EMAIL_MIN_SEVERITY:-}
      DBSPHERE_OTLP_TOKEN: ${DBSPHERE_OTLP_TOKEN:-}
      DBSPHERE_TRACE_RETENTION_DAYS: ${DBSPHERE_TRACE_RETENTION_DAYS:-7}
      DBSPHERE_RETENTION_DAYS: ${DBSPHERE_RETENTION_DAYS:-}
      DBSPHERE_EVENT_RETENTION_DAYS: ${DBSPHERE_EVENT_RETENTION_DAYS:-}
      DBSPHERE_AI_CHAT_URL: ${DBSPHERE_AI_CHAT_URL:-}
      DBSPHERE_AI_MODEL: ${DBSPHERE_AI_MODEL:-}
      DBSPHERE_AI_EVIDENCE_SCHEMA: ${DBSPHERE_AI_EVIDENCE_SCHEMA:-false}
      DBSPHERE_AI_EVIDENCE_TIMEOUT_SECONDS: ${DBSPHERE_AI_EVIDENCE_TIMEOUT_SECONDS:-28}
      DBSPHERE_AI_API_KEY: ${DBSPHERE_AI_API_KEY:-}
      DBSPHERE_AI_ALLOW_REMOTE: ${DBSPHERE_AI_ALLOW_REMOTE:-false}
    ports:
      - '127.0.0.1:${DBSPHERE_WEB_PORT:-8080}:8080'

  replica:
    <<: *go-app
    profiles: [ha]
    ports: []
    environment:
      <<: *go-environment
      DBSPHERE_REPLICA_NAME: replica

  gateway:
    profiles: [ha]
    build:
      context: ../..
      dockerfile: Dockerfile-go
    restart: unless-stopped
    command: [gateway]
    environment:
      DBSPHERE_HOST: 0.0.0.0
      DBSPHERE_PORT: 8080
      DBSPHERE_GATEWAY_UPSTREAMS: http://app:8080,http://replica:8080
    ports:
      - '127.0.0.1:${DBSPHERE_WEB_PORT:-8080}:8080'
