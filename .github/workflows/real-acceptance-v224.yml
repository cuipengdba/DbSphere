name: v2.24.0 browser acceptance

on:
  push:
    branches: [verify/v2.24-real-acceptance]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-browser-fixture
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the exact release with PostgreSQL 18
        shell: bash
        env:
          DBSPHERE_HOST: 127.0.0.1
          DBSPHERE_PORT: 18080
          DBSPHERE_ADMIN_PASSWORD: dbsphere-browser-admin-fixture
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-browser-fixture@127.0.0.1:15434/postgres?sslmode=disable
          DBSPHERE_ENABLE_GO_COLLECTOR: 'false'
        run: |
          git diff --exit-code refs/tags/v2.24.0 HEAD -- cmd internal public deploy assets.go go.mod go.sum
          printf 'Release commit %s\n' "$(git rev-parse 'refs/tags/v2.24.0^{commit}')"
          export DBSPHERE_MASTER_KEY="$(openssl rand -base64 32)"
          go build -o "$RUNNER_TEMP/dbsphere" ./cmd/dbsphere
          "$RUNNER_TEMP/dbsphere" >"$RUNNER_TEMP/dbsphere.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/readyz
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --no-package-lock @playwright/cli@0.1.22
          export PATH="$RUNNER_TEMP/browser/node_modules/.bin:$PATH"
          playwright-cli install-browser chromium
          playwright-cli -s=v224 open http://127.0.0.1:18080
          playwright-cli -s=v224 run-code --filename .github/qa/v224-browser.js | tee "$RUNNER_TEMP/browser-results.txt"
          grep -q 'V224_BROWSER_PASS' "$RUNNER_TEMP/browser-results.txt"
          playwright-cli -s=v224 close
      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v224-browser-acceptance
          path: ${{ runner.temp }}/browser-results.txt
          if-no-files-found: ignore
