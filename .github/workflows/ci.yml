        run: |
          docker run -d --rm --name dbsphere-wrong-store -p 15437:5432 \
            -e POSTGRES_PASSWORD=dbsphere-store-test postgres:17-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-wrong-store pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
