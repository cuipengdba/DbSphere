          node scripts/reject-non18-store.mjs

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and start one-click stack
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: bash scripts/one-click.sh
      - name: Check B/S service
        run: |
          curl --fail --silent http://127.0.0.1:8080/readyz
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml ps
      - name: Onboard a real PostgreSQL 14 target
        run: |
          docker run -d --rm --name dbsphere-compose-pg14 -p 15435:5432 \
            -e POSTGRES_PASSWORD=dbsphere-root-test postgres:14-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-compose-pg14 pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-compose-pg14 \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
          node scripts/compose-pg-target-smoke.mjs
      - name: Check persistence and storage outage
        run: node scripts/compose-smoke.mjs
      - name: Check one-click K8S kubeconfig mount
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          printf 'DBSPHERE_KUBECONFIG_HOST_PATH=%s\n' "$PWD/test/fixtures/k8s-postgres.yaml" >> deploy/compose/.env
          bash scripts/one-click.sh
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml \
            -f deploy/compose/compose.k8s.yaml exec -T app test -r /etc/dbsphere/kubeconfig
          node scripts/compose-upgrade-smoke.mjs
      - name: Check one-click read-only backup info mount
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/dbsphere-backup-info"
          printf 'DBSPHERE_BACKUP_INFO_HOST_PATH=%s\n' "$RUNNER_TEMP/dbsphere-backup-info" >> deploy/compose/.env
          bash scripts/one-click.sh
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml \
            -f deploy/compose/compose.k8s.yaml -f deploy/compose/compose.backup.yaml \
            exec -T app test -d /etc/dbsphere/backup-info
      - name: Check monitoring store backup manifest mount
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          bash scripts/backup-store.sh "$RUNNER_TEMP/dbsphere-monitor-backup"
          test -s "$RUNNER_TEMP/dbsphere-monitor-backup/monitor-store-backup.json"
          printf 'DBSPHERE_STORE_BACKUP_HOST_PATH=%s\n' "$RUNNER_TEMP/dbsphere-monitor-backup/monitor-store-backup.json" >> deploy/compose/.env
          bash scripts/one-click.sh
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml \
            -f deploy/compose/compose.k8s.yaml -f deploy/compose/compose.backup.yaml \
            -f deploy/compose/compose.store-backup.yaml exec -T app test -r /etc/dbsphere/store-backup.json
          node scripts/compose-store-backup-smoke.mjs
      - name: Reject an invalid kubeconfig path clearly
        run: |
          printf 'DBSPHERE_KUBECONFIG_HOST_PATH=/definitely/missing/kubeconfig\n' >> deploy/compose/.env
          if bash scripts/one-click.sh > "$RUNNER_TEMP/dbsphere-invalid-config.log" 2>&1; then exit 1; fi
          grep -q 'DBSPHERE_KUBECONFIG_HOST_PATH must be an existing absolute file path' \
            "$RUNNER_TEMP/dbsphere-invalid-config.log"

  replication-lag-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate and build isolated Go replication drill
        run: |
          bash -n test/replication-drill/primary-init.sh test/replication-drill/replica-init.sh
          node --check scripts/replication-drill-secrets.mjs
          node --check scripts/replication-drill-acceptance.mjs
          node --check scripts/replication-drill-verify.mjs
          node --check scripts/wal-archive-drill-acceptance.mjs
          node --check scripts/autovacuum-drill-acceptance.mjs
          node --check scripts/connection-pressure-drill-acceptance.mjs
          node scripts/replication-drill-secrets.mjs \
            "$RUNNER_TEMP/dbsphere-replication.env" "$RUNNER_TEMP/dbsphere-replication-credentials.json"
          docker build -f Dockerfile-go -t dbsphere/replication-drill:local .
          docker compose --env-file "$RUNNER_TEMP/dbsphere-replication.env" \
            -f test/replication-drill/compose.yaml config --quiet
      - name: Start PG18 primary, standby, store and Go service
        run: |
          docker compose --env-file "$RUNNER_TEMP/dbsphere-replication.env" \
            -f test/replication-drill/compose.yaml up -d --wait --wait-timeout 300
          curl --fail --silent http://127.0.0.1:18092/readyz | jq -e '.storage=="postgresql18"' >/dev/null
      - name: Verify real lag incident, recovery and restart persistence
        run: |
          node scripts/replication-drill-acceptance.mjs http://127.0.0.1:18092 \
            "$RUNNER_TEMP/dbsphere-replication-credentials.json" > "$RUNNER_TEMP/dbsphere-replication-result.json"
          node scripts/replication-drill-verify.mjs http://127.0.0.1:18092 \
            "$RUNNER_TEMP/dbsphere-replication-credentials.json" "$RUNNER_TEMP/dbsphere-replication-result.json"
          docker compose --env-file "$RUNNER_TEMP/dbsphere-replication.env" \
            -f test/replication-drill/compose.yaml up -d --no-deps --force-recreate app
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:18092/readyz 2>/dev/null |
              jq -e '.storage=="postgresql18"' >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18092/readyz | jq -e '.storage=="postgresql18"' >/dev/null
          node scripts/replication-drill-verify.mjs http://127.0.0.1:18092 \
            "$RUNNER_TEMP/dbsphere-replication-credentials.json" "$RUNNER_TEMP/dbsphere-replication-result.json"
          cat "$RUNNER_TEMP/dbsphere-replication-result.json"
      - name: Verify real WAL archiver failure and same-event recovery
        run: |
          node scripts/wal-archive-drill-acceptance.mjs http://127.0.0.1:18092 \
            "$RUNNER_TEMP/dbsphere-replication-credentials.json" > "$RUNNER_TEMP/dbsphere-wal-archive-result.json"
          cat "$RUNNER_TEMP/dbsphere-wal-archive-result.json"
      - name: Verify real autovacuum shutdown and same-event recovery
        run: |
          node scripts/autovacuum-drill-acceptance.mjs http://127.0.0.1:18092 \
            "$RUNNER_TEMP/dbsphere-replication-credentials.json" > "$RUNNER_TEMP/dbsphere-autovacuum-result.json"
          cat "$RUNNER_TEMP/dbsphere-autovacuum-result.json"
      - name: Verify sustained real connection pressure and same-event recovery
        run: |
          node scripts/connection-pressure-drill-acceptance.mjs http://127.0.0.1:18092 \
            "$RUNNER_TEMP/dbsphere-replication-credentials.json" > "$RUNNER_TEMP/dbsphere-connection-result.json"
          cat "$RUNNER_TEMP/dbsphere-connection-result.json"
      - name: Remove isolated replication drill
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dbsphere-replication.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/dbsphere-replication.env" \
              -f test/replication-drill/compose.yaml down -v --remove-orphans
          fi

  patroni-failover-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build isolated two-node Patroni and Go images
        run: |
          bash -n test/patroni-drill/entrypoint.sh
          node --check scripts/patroni-drill-acceptance.mjs
          node scripts/replication-drill-secrets.mjs \
            "$RUNNER_TEMP/dbsphere-patroni.env" "$RUNNER_TEMP/dbsphere-patroni-credentials.json"
          printf 'DBSPHERE_DRILL_PG_MAJOR=%s\n' '${{ matrix.pg }}' >> "$RUNNER_TEMP/dbsphere-patroni.env"
          docker compose --env-file "$RUNNER_TEMP/dbsphere-patroni.env" \
            -f test/patroni-drill/compose.yaml config --quiet
          docker build --build-arg PG_MAJOR=${{ matrix.pg }} \
            -f test/patroni-drill/Dockerfile -t dbsphere/patroni-drill:local .
          docker build -f Dockerfile-go -t dbsphere/patroni-app-drill:local .
      - name: Start PG18 store and real Patroni election cluster
        run: |
          docker compose --env-file "$RUNNER_TEMP/dbsphere-patroni.env" \
            -f test/patroni-drill/compose.yaml up -d --wait --wait-timeout 300
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:18097/readyz 2>/dev/null |
              jq -e '.storage=="postgresql18"' >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18097/readyz | jq -e '.storage=="postgresql18"' >/dev/null
      - name: Verify one incident across leader failure and recovery
        run: |
          node scripts/patroni-drill-acceptance.mjs http://127.0.0.1:18097 \
            "$RUNNER_TEMP/dbsphere-patroni-credentials.json" \
            "$RUNNER_TEMP/dbsphere-patroni.env" \
            "$RUNNER_TEMP/dbsphere-patroni-result.json" '${{ matrix.pg }}'
          cat "$RUNNER_TEMP/dbsphere-patroni-result.json"
      - name: Remove isolated Patroni drill
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dbsphere-patroni.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/dbsphere-patroni.env" \
              -f test/patroni-drill/compose.yaml down -v --remove-orphans
          fi

  kind-pg14-19-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/otel-sdk-probe/go.sum
      - name: Install pinned kind and kubectl
        run: |
          mkdir -p "$RUNNER_TEMP/dbsphere-bin"
          cd "$RUNNER_TEMP/dbsphere-bin"
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -O https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -O https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          sha256sum --check kind-linux-amd64.sha256sum
          mv kind-linux-amd64 kind
          chmod +x kind
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -O https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -O https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP/dbsphere-bin" >> "$GITHUB_PATH"
          echo "KUBECONFIG=$RUNNER_TEMP/dbsphere-kind-admin.kubeconfig" >> "$GITHUB_ENV"
      - name: Create isolated four-node Kubernetes cluster
        run: |
          cat > "$RUNNER_TEMP/dbsphere-kind-config.yaml" <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
            - role: worker
          YAML
          kind create cluster --name dbsphere-ci --config "$RUNNER_TEMP/dbsphere-kind-config.yaml" --wait 180s
          kind get kubeconfig --name dbsphere-ci > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl get nodes -o wide
      - name: Deploy Go console, PostgreSQL 18 store and six target versions
        run: |
          docker build -f Dockerfile-go -t dbsphere/kind-matrix:local .
          docker build -f examples/trace-lock-app/Dockerfile -t dbsphere/trace-lock-app:kind-oom .
          (cd examples/otel-sdk-probe && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags='-s -w' -o sdk-oom-app .)
          docker build -f examples/otel-sdk-probe/Dockerfile -t dbsphere/otel-sdk-probe:kind-oom .
          kind load docker-image dbsphere/kind-matrix:local --name dbsphere-ci
          kind load docker-image dbsphere/trace-lock-app:kind-oom --name dbsphere-ci
          kind load docker-image dbsphere/otel-sdk-probe:kind-oom --name dbsphere-ci
          node scripts/kind-matrix-manifest.mjs dbsphere-ci "$RUNNER_TEMP/dbsphere-kind-manifest.json"
          node scripts/kind-matrix-secrets.mjs \
            "$RUNNER_TEMP/dbsphere-kind-secret.json" "$RUNNER_TEMP/dbsphere-kind-credentials.json"
          kubectl create namespace dbsphere-matrix
          kubectl create namespace agentsql
          kubectl apply -f "$RUNNER_TEMP/dbsphere-kind-secret.json"
          kubectl apply -f "$RUNNER_TEMP/dbsphere-kind-manifest.json"
          kubectl -n dbsphere-matrix wait --for=condition=available deployment --all --timeout=300s
          kubectl -n dbsphere-matrix get pods,pvc -o wide
      - name: Verify real application Pod and Bound PVC with read-only Kubernetes credentials
        run: |
          reader_config="$RUNNER_TEMP/dbsphere-reader.kubeconfig"
          ca_file="$RUNNER_TEMP/dbsphere-kind-ca.crt"
          server="$(kubectl config view --raw --minify -o json | jq -r '.clusters[0].cluster.server')"
          kubectl config view --raw --minify -o json |
            jq -r '.clusters[0].cluster["certificate-authority-data"]' | base64 -d > "$ca_file"
          token="$(kubectl -n dbsphere-matrix create token dbsphere-reader --duration=10m)"
          kubectl config set-cluster dbsphere-ci --server="$server" \
            --certificate-authority="$ca_file" --embed-certs=true --kubeconfig="$reader_config"
          kubectl config set-credentials reader --token="$token" --kubeconfig="$reader_config"
          unset token
          kubectl config set-context reader --cluster=dbsphere-ci --user=reader --kubeconfig="$reader_config"
          kubectl config use-context reader --kubeconfig="$reader_config"
          chmod 600 "$reader_config"
          test "$(kubectl --kubeconfig "$reader_config" -n dbsphere-matrix auth can-i get persistentvolumeclaims)" = yes
          test "$(kubectl --kubeconfig "$reader_config" -n dbsphere-matrix auth can-i get secrets)" = no
          pod="$(kubectl -n dbsphere-matrix get pods -l app=pg18 -o jsonpath='{.items[0].metadata.name}')"
          uid="$(kubectl -n dbsphere-matrix get pod "$pod" -o jsonpath='{.metadata.uid}')"
          test -n "$pod" && test -n "$uid"
          DBSPHERE_KUBECONFIG="$reader_config" \
          DBSPHERE_TEST_K8S_APP_NAMESPACE=dbsphere-matrix \
          DBSPHERE_TEST_K8S_APP_POD="$pod" \
          DBSPHERE_TEST_K8S_APP_UID="$uid" \
          DBSPHERE_TEST_K8S_APP_PVC=pg18-data \
          DBSPHERE_TEST_K8S_APP_PVC_PHASE=Bound \
            go test ./internal/collector -run '^TestRealKubernetesApplicationPodIdentity$' -count=1 -v
      - name: Verify PG14-19 and cross-node Kubernetes evidence after Pod replacement
        run: |
          node --check scripts/kind-matrix-verify-persistence.mjs
          forward_pid=''
          trap 'if [ -n "$forward_pid" ]; then kill "$forward_pid" 2>/dev/null || true; fi' EXIT
          start_forward() {
            kubectl -n dbsphere-matrix port-forward svc/dbsphere-go 18091:8080 > "$RUNNER_TEMP/dbsphere-kind-forward.log" 2>&1 &
            forward_pid=$!
            for attempt in {1..60}; do
              if curl -fsS http://127.0.0.1:18091/readyz 2>/dev/null |
                jq -e '.storage=="postgresql18"' >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:18091/readyz | jq -e '.storage=="postgresql18"' >/dev/null
          }
          start_forward
          node scripts/kind-matrix-acceptance.mjs http://127.0.0.1:18091 \
            "$RUNNER_TEMP/dbsphere-kind-credentials.json" "$KUBECONFIG" dbsphere-ci \
            > "$RUNNER_TEMP/dbsphere-kind-before.json"
          kill "$forward_pid" 2>/dev/null || true
          wait "$forward_pid" 2>/dev/null || true
          forward_pid=''
          kubectl -n dbsphere-matrix delete pod -l app=dbsphere-go --wait=true
          kubectl -n dbsphere-matrix rollout status deployment/dbsphere-go --timeout=180s
          kubectl -n dbsphere-matrix delete pod -l app=dbsphere-store --wait=true
          kubectl -n dbsphere-matrix rollout status deployment/dbsphere-store --timeout=180s
          start_forward
          node scripts/kind-matrix-acceptance.mjs http://127.0.0.1:18091 \
            "$RUNNER_TEMP/dbsphere-kind-credentials.json" "$KUBECONFIG" dbsphere-ci \
            > "$RUNNER_TEMP/dbsphere-kind-after.json"
          node scripts/kind-matrix-verify-persistence.mjs http://127.0.0.1:18091 \
            "$RUNNER_TEMP/dbsphere-kind-credentials.json" \
            "$RUNNER_TEMP/dbsphere-kind-before.json" "$RUNNER_TEMP/dbsphere-kind-after.json"
          node scripts/kind-kubernetes-identity.mjs http://127.0.0.1:18091 \
            "$RUNNER_TEMP/dbsphere-kind-credentials.json" "$KUBECONFIG" kind-dbsphere-ci
          node scripts/kind-service-route-acceptance.mjs http://127.0.0.1:18091 \
            "$RUNNER_TEMP/dbsphere-kind-credentials.json" "$KUBECONFIG" kind-dbsphere-ci
      - name: Verify one real application incident across PostgreSQL Pod OOM and recovery
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --check scripts/kind-matrix-app-oom.mjs
          kubectl -n dbsphere-matrix port-forward svc/dbsphere-go 18091:8080 \
            > "$RUNNER_TEMP/dbsphere-oom-go-forward.log" 2>&1 &
          go_forward=$!
          kubectl -n dbsphere-matrix port-forward svc/dbsphere-oom-app 18092:18092 \
            > "$RUNNER_TEMP/dbsphere-oom-app-forward.log" 2>&1 &
          app_forward=$!
          kubectl -n dbsphere-matrix port-forward svc/dbsphere-sdk-oom-app 18093:18093 \
            > "$RUNNER_TEMP/dbsphere-sdk-oom-app-forward.log" 2>&1 &
          sdk_forward=$!
          trap 'kill "$go_forward" "$app_forward" "$sdk_forward" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:18091/readyz >/dev/null 2>&1 &&
              curl -fsS http://127.0.0.1:18092/healthz >/dev/null 2>&1 &&
              curl -fsS http://127.0.0.1:18093/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18091/readyz | jq -e '.storage=="postgresql18"' >/dev/null
          curl -fsS http://127.0.0.1:18092/healthz >/dev/null
          curl -fsS http://127.0.0.1:18093/healthz >/dev/null
          node scripts/kind-matrix-app-oom.mjs \
            http://127.0.0.1:18091 http://127.0.0.1:18092 http://127.0.0.1:18093 \
            "$RUNNER_TEMP/dbsphere-kind-credentials.json" "$KUBECONFIG" \
            "$RUNNER_TEMP/dbsphere-kind-oom-result.json"
          cat "$RUNNER_TEMP/dbsphere-kind-oom-result.json"
      - name: Remove isolated Kubernetes cluster
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then kind delete cluster --name dbsphere-ci; fi

  cnpg-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install verified Kubernetes test tooling
        run: |
          mkdir -p "$RUNNER_TEMP/dbsphere-bin"
          cd "$RUNNER_TEMP/dbsphere-bin"
          curl -fLsS --retry 4 -O https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fLsS --retry 4 -O https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          sha256sum --check kind-linux-amd64.sha256sum
          mv kind-linux-amd64 kind
          curl -fLsS --retry 4 -O https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
          curl -fLsS --retry 4 -O https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kind kubectl
          echo "$RUNNER_TEMP/dbsphere-bin" >> "$GITHUB_PATH"
          echo "KUBECONFIG=$RUNNER_TEMP/dbsphere-cnpg.kubeconfig" >> "$GITHUB_ENV"
      - name: Start CloudNativePG 1.30.2 on Kubernetes 1.35.8
        run: |
          cat > "$RUNNER_TEMP/dbsphere-cnpg-kind.yaml" <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
          YAML
          kind create cluster --name dbsphere-cnpg --config "$RUNNER_TEMP/dbsphere-cnpg-kind.yaml" \
            --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 --wait 180s
          manifest="$RUNNER_TEMP/cnpg-1.30.2.yaml"
          curl -fLsS --retry 4 https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.2/cnpg-1.30.2.yaml -o "$manifest"
          echo "ea4cc355b394e10661d30c6b409cefb19029dd973bccb76b1ed8c789985bc68c  $manifest" | sha256sum --check
          kubectl apply --server-side -f "$manifest"
          kubectl -n cnpg-system rollout status deployment/cnpg-controller-manager --timeout=180s
      - name: Deploy DbSphere and verify operator failover and recovery
        run: |
          docker build -f Dockerfile-go -t dbsphere/kind-matrix:local .
          kind load docker-image dbsphere/kind-matrix:local --name dbsphere-cnpg
          node scripts/kind-matrix-manifest.mjs dbsphere-cnpg "$RUNNER_TEMP/dbsphere-cnpg-full.json"
          node scripts/kind-matrix-secrets.mjs "$RUNNER_TEMP/dbsphere-cnpg-secret.json" "$RUNNER_TEMP/dbsphere-cnpg-credentials.json"
          jq '.items |= (map(.metadata.name as $name | select([
                "dbsphere-matrix","dbsphere-reader","dbsphere-matrix-node-reader","dbsphere-store-data","dbsphere-store","dbsphere-go"
              ] | index($name))) | map(if .kind=="Role" and .metadata.name=="dbsphere-reader"
              then .rules += [{apiGroups:["postgresql.cnpg.io"],resources:["clusters"],verbs:["get","list"]}] else . end))' \
            "$RUNNER_TEMP/dbsphere-cnpg-full.json" > "$RUNNER_TEMP/dbsphere-cnpg-app.json"
          kubectl create namespace dbsphere-matrix
          kubectl apply -f "$RUNNER_TEMP/dbsphere-cnpg-secret.json"
          kubectl apply -f "$RUNNER_TEMP/dbsphere-cnpg-app.json"
          kubectl -n dbsphere-matrix wait --for=condition=available deployment --all --timeout=240s
          kubectl -n dbsphere-matrix port-forward svc/dbsphere-go 18094:8080 > "$RUNNER_TEMP/dbsphere-cnpg-forward.log" 2>&1 &
          forward=$!
          trap 'kill "$forward" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:18094/readyz 2>/dev/null | jq -e '.storage=="postgresql18"' >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18094/readyz | jq -e '.storage=="postgresql18"' >/dev/null
          node scripts/kind-cnpg-acceptance.mjs http://127.0.0.1:18094 \
            "$RUNNER_TEMP/dbsphere-cnpg-credentials.json" "$KUBECONFIG" kind-dbsphere-cnpg "$RUNNER_TEMP/dbsphere-cnpg-result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dbsphere-cnpg-acceptance
          path: ${{ runner.temp }}/dbsphere-cnpg-result.json
          if-no-files-found: error
      - name: Remove isolated operator cluster
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then kind delete cluster --name dbsphere-cnpg; fi

  external-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start independent PostgreSQL 18
        run: |
          docker run -d --rm --network host --name dbsphere-external-pgtest \
            -e POSTGRES_USER=dbsphere -e POSTGRES_DB=dbsphere \
            -e POSTGRES_PASSWORD=dbsphere-external-test \
            postgres:18-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-external-pgtest pg_isready -h 127.0.0.1 -U dbsphere -d dbsphere >/dev/null 2>&1; then break; fi
            sleep 1
          done
      - name: One-click external PG18 mode
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          umask 077
          printf 'DBSPHERE_ADMIN_PASSWORD=dbsphere-external-admin-test\nDBSPHERE_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\nDBSPHERE_DATABASE_URL=postgres://dbsphere:dbsphere-external-test@host.docker.internal:5432/dbsphere\nDBSPHERE_WEB_PORT=8080\n' > deploy/compose/.env
          bash scripts/one-click.sh
          curl --fail --silent http://127.0.0.1:8080/readyz

  linux-exporter:
    runs-on: ubuntu-latest
    services:
      store:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL 14 and node_exporter
        run: |
          docker run -d --rm --name dbsphere-linux-pgtest -p 15435:5432 \
            -e POSTGRES_PASSWORD=dbsphere-root-test postgres:14-bookworm
          docker run -d --rm --name dbsphere-linux-exporter -p 19100:9100 \
            --pid host -v /:/host:ro,rslave quay.io/prometheus/node-exporter:v1.12.1 \
            --path.rootfs=/host
          for i in $(seq 1 60); do
            if docker exec dbsphere-linux-pgtest pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-linux-pgtest \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
          curl --fail --silent http://127.0.0.1:19100/metrics >/dev/null
      - name: Check cross-layer collection and restart persistence
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_DATA_DIR: ${{ runner.temp }}/dbsphere-linux-exporter-smoke
          DBSPHERE_TEST_PG_PORT: '15435'
          DBSPHERE_TEST_EXPORTER_PORT: '19100'
        run: node scripts/linux-exporter-smoke.mjs
      - name: Keep Linux evidence in one Go PostgreSQL failure event
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_PG_TARGET_PORT: '15435'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-root-test
          DBSPHERE_TEST_NODE_EXPORTER_PORT: '19100'
        run: go test ./internal/collector ./internal/store -run 'TestRealNodeExporter|TestLinuxEvidenceSurvivesPostgresConnectionFailure' -count=1 -v

  pgbouncer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18, 19]
    services:
      store:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        if: matrix.pg == 14
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL ${{ matrix.pg }} and PgBouncer
        run: |
          docker network create dbsphere-pooltest
          docker run -d --rm --name dbsphere-pg-pooltest --network dbsphere-pooltest \
            -p 15435:5432 -e POSTGRES_PASSWORD=dbsphere-root-test postgres:${{ matrix.pg }}-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-pg-pooltest pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-pg-pooltest \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
          docker run -d --rm --name dbsphere-pooler-pgtest --network dbsphere-pooltest \
            -p 16433:5432 -e DB_USER=dbsphere_monitor -e DB_PASSWORD=dbsphere-monitor-test \
            -e DB_HOST=dbsphere-pg-pooltest -e DB_NAME=postgres \
            -e STATS_USERS=dbsphere_monitor -e AUTH_TYPE=scram-sha-256 \
            edoburu/pgbouncer:v1.26.1-p0
          for i in $(seq 1 60); do
            if docker exec dbsphere-pooler-pgtest pg_isready -h 127.0.0.1 -U dbsphere_monitor -d pgbouncer >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-monitor-test dbsphere-pg-pooltest \
            psql -h dbsphere-pooler-pgtest -U dbsphere_monitor -d postgres -v ON_ERROR_STOP=1 -c 'SELECT 1'
      - name: Check PgBouncer metrics and PG18 persistence
        if: matrix.pg == 14
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_DATA_DIR: ${{ runner.temp }}/dbsphere-pgbouncer-smoke
          DBSPHERE_TEST_PG_PORT: '15435'
          DBSPHERE_TEST_POOLER_PORT: '16433'
        run: node scripts/pgbouncer-smoke.mjs
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check Go PgBouncer read-only collection and PG18 sample
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_PG_TARGET_PORT: '15435'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-root-test
          DBSPHERE_TEST_POOLER_URL: postgres://dbsphere_monitor:dbsphere-monitor-test@127.0.0.1:16433/pgbouncer
        run: go test ./internal/collector ./internal/store -run 'TestPgBouncer|TestGoPgBouncerCombinedSampleInPG18|TestRealPgBouncerEndpointMapsApplicationTracePG18' -count=1
      - name: Trace one real HTTP lock incident through PgBouncer
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TRACE_ACCEPTANCE_PROOF: ${{ runner.temp }}/trace-pg${{ matrix.pg }}.json
          DBSPHERE_TEST_PG_TARGET_PORT: '15435'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-root-test
          DBSPHERE_TEST_POOLER_URL: postgres://dbsphere_monitor:dbsphere-monitor-test@127.0.0.1:16433/pgbouncer
        run: go test ./examples/trace-lock-app -run '^TestApplicationLockTraceThrough(PgBouncer|SeparatePgBouncerEndpoint)UsesOneDbSphereEventID$' -count=1 -v
      - name: Verify real PgBouncer exhaustion and HAProxy backend mismatch
        if: matrix.pg == 18
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_ROUTE_PG_URL: postgres://dbsphere_monitor:dbsphere-monitor-test@127.0.0.1:15435/postgres
          DBSPHERE_TEST_ROUTE_POOLER_URL: postgres://dbsphere_monitor:dbsphere-monitor-test@127.0.0.1:16434/pgbouncer
          DBSPHERE_TEST_HAPROXY_ROUTE: 127.0.0.1:16435
          DBSPHERE_TEST_HAPROXY_RECOVERY: 127.0.0.1:16436
          DBSPHERE_TEST_HAPROXY_STATS: http://reader:route-stats-test@127.0.0.1:16437/stats
        run: |
          docker run -d --rm --name dbsphere-route-limited --network dbsphere-pooltest -p 16434:5432 \
            -e DB_USER=dbsphere_monitor -e DB_PASSWORD=dbsphere-monitor-test -e DB_HOST=dbsphere-pg-pooltest \
            -e DB_NAME=postgres -e STATS_USERS=dbsphere_monitor -e AUTH_TYPE=scram-sha-256 \
            -e POOL_MODE=transaction -e DEFAULT_POOL_SIZE=1 -e RESERVE_POOL_SIZE=0 edoburu/pgbouncer:v1.26.1-p0
          for attempt in {1..30}; do
            if docker exec dbsphere-route-limited pg_isready -h 127.0.0.1 -U dbsphere_monitor -d pgbouncer >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-monitor-test dbsphere-pg-pooltest \
            psql -h dbsphere-route-limited -U dbsphere_monitor -d postgres -v ON_ERROR_STOP=1 -c 'SELECT 1'
          docker run -d --rm --name dbsphere-route-other --network dbsphere-pooltest \
            -e POSTGRES_PASSWORD=dbsphere-root-test postgres:18-bookworm
          for attempt in {1..60}; do
            if docker exec dbsphere-route-other pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-route-other \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
          cat > "$RUNNER_TEMP/dbsphere-route-haproxy.cfg" <<'CONFIG'
          defaults
            mode tcp
            timeout connect 2s
            timeout client  30s
            timeout server  30s
          frontend wrong
            bind :5433
            default_backend pg_wrong
          frontend correct
            bind :5434
            default_backend pg_correct
          backend pg_wrong
            server alternate dbsphere-route-other:5432 check
          backend pg_correct
            server monitored dbsphere-pg-pooltest:5432 check
          listen stats
            bind :8404
            mode http
            stats enable
            stats uri /stats
            stats auth reader:route-stats-test
          CONFIG
          docker run -d --rm --name dbsphere-route-haproxy --network dbsphere-pooltest \
            -p 16435:5433 -p 16436:5434 -p 16437:8404 \
            --mount "type=bind,source=$RUNNER_TEMP/dbsphere-route-haproxy.cfg,target=/usr/local/etc/haproxy/haproxy.cfg,readonly" \
            haproxy:3.2-alpine@sha256:7816a9801a6846b912bc37e48529808e2fa87c3c47992441940f68e393ebcfeb
          if ! curl -fsS --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 \
            --user reader:route-stats-test 'http://127.0.0.1:16437/stats;csv' -o "$RUNNER_TEMP/dbsphere-route-haproxy-stats.csv"; then
            docker logs dbsphere-route-haproxy
            exit 1
          fi
          go test ./internal/store -run '^TestReal(PgBouncerPoolExhaustion|HAProxyRouteMismatch)KeepsOneEvent$' -count=1 -v
      - uses: actions/upload-artifact@v4
        with:
          name: dbsphere-multiservice-trace-pg${{ matrix.pg }}
          path: ${{ runner.temp }}/trace-pg${{ matrix.pg }}.json
          if-no-files-found: error
