name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  go-foundation:
    runs-on: ubuntu-latest
    services:
      pg18:
        image: postgres:18-bookworm
        ports:
          - 15434:5432
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/otel-sdk-probe/go.sum
      - name: Test and vet Go foundation against PostgreSQL 18
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: |
          go test -p 1 ./...
          go vet ./...
      - name: Build official OpenTelemetry Go SDK acceptance probe
        run: |
          cd examples/otel-sdk-probe
          go test ./...
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/dbsphere-otel-sdk-probe" .
      - name: Build and start Go binary with embedded static pages
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_ADMIN_PASSWORD: first-bootstrap-password
          DBSPHERE_HOST: 127.0.0.1
          DBSPHERE_PORT: '18085'
        run: |
          export DBSPHERE_MASTER_KEY="$(openssl rand -base64 32)"
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/dbsphere-go" ./cmd/dbsphere
          "$RUNNER_TEMP/dbsphere-go" > "$RUNNER_TEMP/dbsphere-go.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18085/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18085/healthz
          curl --fail --silent http://127.0.0.1:18085/readyz
          curl --fail --silent http://127.0.0.1:18085/api/version | grep '"backend":"go"'
          curl --fail --silent http://127.0.0.1:18085/ | grep 'DbSphere'
          curl --fail --silent -c "$RUNNER_TEMP/dbsphere-go-cookies" \
            -H 'Content-Type: application/json' \
            -d '{"password":"first-bootstrap-password"}' \
            http://127.0.0.1:18085/api/login | grep '"authenticated":true'
          curl --fail --silent -b "$RUNNER_TEMP/dbsphere-go-cookies" \
            http://127.0.0.1:18085/api/session | grep '"authenticated":true'

  go-storage-retention-capacity:
    runs-on: ubuntu-latest
    services:
      pg18:
        image: postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
        ports:
          - 15434:5432
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Drain 120000 samples and 5000 events from an isolated PostgreSQL 18 store
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_PG18_CAPACITY: '1'
        run: go test ./cmd/dbsphere -run '^TestRunDataRetentionDrainsBacklog$' -count=1 -timeout 5m -v

  go-dependency-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify Go module downloads and install pinned audit tools
        run: |
          go mod verify
          mkdir -p "$RUNNER_TEMP/dbsphere-tools"
          GOBIN="$RUNNER_TEMP/dbsphere-tools" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          GOBIN="$RUNNER_TEMP/dbsphere-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Generate CycloneDX SBOM for the Linux Go application
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            "$RUNNER_TEMP/dbsphere-tools/cyclonedx-gomod" app \
            -json -licenses -packages -main cmd/dbsphere \
            -output "$RUNNER_TEMP/dbsphere-go-linux-amd64.cdx.json" .
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
            "$RUNNER_TEMP/dbsphere-go-linux-amd64.cdx.json" >/dev/null
          test -s LICENSE
          jq -r '.components[].name' "$RUNNER_TEMP/dbsphere-go-linux-amd64.cdx.json" |
            while IFS= read -r module; do
              test -s "third_party/licenses/go/$module/LICENSE"
            done
      - name: Scan reachable Go vulnerabilities
        run: |
          "$RUNNER_TEMP/dbsphere-tools/govulncheck" ./...
      - name: Preserve Go SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbsphere-go-linux-amd64-sbom
          path: ${{ runner.temp }}/dbsphere-go-linux-amd64.cdx.json
          if-no-files-found: warn

  go-pg-compat-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18', '19']
    services:
      store:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      target:
        image: postgres:${{ matrix.pg }}-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-target-test
        ports:
          - 15435:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/otel-sdk-probe/go.sum
      - name: Verify Go collection, event linkage and real HTTP lock Trace on PostgreSQL ${{ matrix.pg }}
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_PG_TARGET_PORT: '15435'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-target-test
          DBSPHERE_TEST_PG_TARGET_MAJOR: ${{ matrix.pg }}
        # These packages observe the same target-wide pg_stat_activity. Running
        # their real lock drills concurrently can make one drill see another's waiter.
        run: go test -p 1 ./internal/collector ./internal/store ./examples/trace-lock-app -count=1 -v
      - name: Verify official Go SDK real HTTP lock incident on PostgreSQL ${{ matrix.pg }}
        working-directory: examples/otel-sdk-probe
        env:
          DBSPHERE_TEST_SDK_LOCK_MODE: direct
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_PG_TARGET_PORT: '15435'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-target-test
        run: go test -run '^TestSDKLockIncidentUsesOneDbSphereEventID$' -count=1 -timeout 4m -v
      - name: Verify official Go SDK through Collector in the same PG18 incident
        if: matrix.pg == '18'
        working-directory: examples/otel-sdk-probe
        env:
          DBSPHERE_TEST_SDK_LOCK_MODE: collector
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_PG_TARGET_PORT: '15435'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-target-test
        run: |
          docker pull otel/opentelemetry-collector:0.165.0
          go test -run '^TestSDKLockIncidentUsesOneDbSphereEventID$' -count=1 -timeout 4m -v

  offline-upgrade-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Drill offline upgrade and application rollback with persistent PG18
        run: bash scripts/offline-upgrade-rollback-smoke.sh "$RUNNER_TEMP/dbsphere-offline-upgrade"

  native-offline-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build native Node.js offline package
        run: bash scripts/build-node-offline-bundle.sh "$RUNNER_TEMP/dbsphere-node-output"
      - name: Start B/S from offline package without package manager
        env:
          DBSPHERE_CONFIG_DIR: ${{ runner.temp }}/dbsphere-node-config
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_PORT: '8090'
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          docker run -d --rm --name dbsphere-node-offline-store -p 15434:5432 \
            -e POSTGRES_PASSWORD=dbsphere-store-test postgres:18-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-node-offline-store pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/dbsphere-node-extracted"
          archive=("$RUNNER_TEMP"/dbsphere-node-output/DbSphere-node-*.tar.gz)
          test "${#archive[@]}" -eq 1
          tar -xzf "${archive[0]}" -C "$RUNNER_TEMP/dbsphere-node-extracted"
          bash "$RUNNER_TEMP/dbsphere-node-extracted/run.sh" > "$RUNNER_TEMP/dbsphere-node.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8090/readyz >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat "$RUNNER_TEMP/dbsphere-node.log"; exit 1; fi
          test -f "$DBSPHERE_CONFIG_DIR/dbsphere.env"
          curl --fail --silent http://127.0.0.1:8090/readyz

  offline-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build offline one-click package on Linux
        run: bash scripts/build-offline-bundle.sh "$RUNNER_TEMP/dbsphere-offline-output"
      - name: Install with local images only
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
          DBSPHERE_CONFIG_DIR: ${{ runner.temp }}/dbsphere-offline-config
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-offline-output/DbSphere-offline-*.run)
          test "${#archive[@]}" -eq 1
          version="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          docker image rm "dbsphere/offline-app:$version" postgres:18-bookworm
          if docker image inspect "dbsphere/offline-app:$version" >/dev/null 2>&1; then exit 1; fi
          bash "${archive[0]}"
          curl --fail --silent http://127.0.0.1:8080/readyz
          docker image inspect "dbsphere/offline-app:$version" postgres:18-bookworm >/dev/null
          bash "${archive[0]}"
          curl --fail --silent http://127.0.0.1:8080/readyz

  go-offline-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Go deployment scripts
        run: |
          for script in one-click-go build-go-offline-bundle install-go-offline backup-go-store go-offline-airgap-smoke go-offline-nested-airgap-smoke offline-self-extract build-go-systemd-bundle install-go-systemd go-systemd-smoke; do
            bash -n "scripts/$script.sh"
          done
      - name: Build Go static container and PostgreSQL 18 offline bundle
        run: bash scripts/build-go-offline-bundle.sh "$RUNNER_TEMP/dbsphere-go-offline-output"
      - name: Extract static Linux Go binary for external PostgreSQL 18
        run: |
          version="$(jq -r .version package.json)"
          mkdir -p "$RUNNER_TEMP/dbsphere-go-native"
          binary="$RUNNER_TEMP/dbsphere-go-native/DbSphere-go-$version-linux-amd64"
          container="$(docker create "dbsphere/offline-go-app:$version")"
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/dbsphere" "$binary"
          chmod 0755 "$binary"
          file -b "$binary" | grep -Fq 'statically linked'
          (cd "$RUNNER_TEMP/dbsphere-go-native" && sha256sum "$(basename "$binary")" > "$(basename "$binary").sha256")
          mkdir -p "$RUNNER_TEMP/dbsphere-go-native/licenses"
          cp LICENSE "$RUNNER_TEMP/dbsphere-go-native/licenses/DBSphere-LICENSE"
          cp -R third_party/licenses/go "$RUNNER_TEMP/dbsphere-go-native/licenses/go"
          licenses="$RUNNER_TEMP/dbsphere-go-native/DbSphere-go-licenses-$version.tar.gz"
          tar -C "$RUNNER_TEMP/dbsphere-go-native" -czf "$licenses" licenses
          (cd "$RUNNER_TEMP/dbsphere-go-native" && sha256sum "$(basename "$licenses")" > "$(basename "$licenses").sha256")
          bash scripts/build-go-systemd-bundle.sh "$binary" "$RUNNER_TEMP/dbsphere-go-native"
      - name: Reject missing and altered offline checksums
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-offline-output/DbSphere-go-offline-*.run)
          test "${#archive[@]}" -eq 1
          checksum="${archive[0]}.sha256"
          saved="$checksum.ci-original"
          mv "$checksum" "$saved"
          trap 'mv -f "$saved" "$checksum"' EXIT
          if output="$(bash "${archive[0]}" 2>&1)"; then exit 1; fi
          grep -Fq 'SHA-256 file is missing' <<< "$output"
          printf '%064d  %s\n' 0 "$(basename "${archive[0]}")" > "$checksum"
          if output="$(bash "${archive[0]}" 2>&1)"; then exit 1; fi
          grep -Fq 'SHA-256 verification failed' <<< "$output"
      - name: Generate SBOMs for the exact bundled container images
        run: |
          mkdir -p "$RUNNER_TEMP/dbsphere-syft"
          curl -fLsS -o "$RUNNER_TEMP/dbsphere-syft/syft.tar.gz" \
            https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_linux_amd64.tar.gz
          printf '%s  %s\n' \
            ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b \
            "$RUNNER_TEMP/dbsphere-syft/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dbsphere-syft/syft.tar.gz" -C "$RUNNER_TEMP/dbsphere-syft" syft
          version="$(jq -r .version package.json)"
          "$RUNNER_TEMP/dbsphere-syft/syft" "dbsphere/offline-go-app:$version" --from docker \
            -o "cyclonedx-json=$RUNNER_TEMP/dbsphere-go-image.cdx.json"
          "$RUNNER_TEMP/dbsphere-syft/syft" postgres:18-bookworm --from docker \
            -o "cyclonedx-json=$RUNNER_TEMP/dbsphere-postgres18-image.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
            "$RUNNER_TEMP/dbsphere-go-image.cdx.json" >/dev/null
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
            "$RUNNER_TEMP/dbsphere-postgres18-image.cdx.json" >/dev/null
          docker image inspect "dbsphere/offline-go-app:$version" postgres:18-bookworm \
            --format '{{.Id}} {{join .RepoDigests " "}}' > "$RUNNER_TEMP/dbsphere-image-ids.txt"
      - name: Preserve bundled image SBOMs and image IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbsphere-offline-image-sboms
          path: |
            ${{ runner.temp }}/dbsphere-go-image.cdx.json
            ${{ runner.temp }}/dbsphere-postgres18-image.cdx.json
            ${{ runner.temp }}/dbsphere-image-ids.txt
          if-no-files-found: warn
      - name: Install Go bundle from a network-disabled CLI container
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-offline-output/DbSphere-go-offline-*.run)
          test "${#archive[@]}" -eq 1
          bash scripts/go-offline-airgap-smoke.sh "${archive[0]}" "$RUNNER_TEMP/dbsphere-go-airgap"
      - name: Install Go container twice from local images
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
          DBSPHERE_GO_CONFIG_DIR: ${{ runner.temp }}/dbsphere-go-offline-config
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-offline-output/DbSphere-go-offline-*.run)
          test "${#archive[@]}" -eq 1
          version="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          docker image rm "dbsphere/offline-go-app:$version" postgres:18-bookworm
          if docker image inspect "dbsphere/offline-go-app:$version" >/dev/null 2>&1; then exit 1; fi
          bash "${archive[0]}"
          curl --fail --silent http://127.0.0.1:8081/readyz
          curl --fail --silent http://127.0.0.1:8081/ | grep 'DbSphere'
          docker image inspect "dbsphere/offline-go-app:$version" postgres:18-bookworm >/dev/null
          bash "${archive[0]}"
          curl --fail --silent http://127.0.0.1:8081/readyz

      - name: Rotate Go offline administrator password and revoke old session
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
          DBSPHERE_GO_CONFIG_DIR: ${{ runner.temp }}/dbsphere-go-offline-config
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-offline-output/DbSphere-go-offline-*.run)
          test "${#archive[@]}" -eq 1
          env_file="$DBSPHERE_GO_CONFIG_DIR/dbsphere-go.env"
          old_password="$(sed -n 's/^DBSPHERE_ADMIN_PASSWORD=//p' "$env_file" | head -n 1)"
          jq -nc --arg password "$old_password" '{password:$password}' |
            curl --fail --silent --show-error -c "$RUNNER_TEMP/dbsphere-old-admin-cookie" \
              -H 'Content-Type: application/json' --data-binary @- http://127.0.0.1:8081/api/login >/dev/null
          new_password='dbsphere-rotated-ci-password'
          sed -i "s/^DBSPHERE_ADMIN_PASSWORD=.*/DBSPHERE_ADMIN_PASSWORD=$new_password/" "$env_file"
          bash "${archive[0]}" --rotate-admin-password
          jq -nc --arg password "$new_password" '{password:$password}' |
            curl --fail --silent --show-error -H 'Content-Type: application/json' \
              --data-binary @- http://127.0.0.1:8081/api/login | jq -e '.role=="admin"' >/dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' \
            -b "$RUNNER_TEMP/dbsphere-old-admin-cookie" http://127.0.0.1:8081/api/assets)" = 401
          test "$(jq -nc --arg password "$old_password" '{password:$password}' |
            curl --silent -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
              --data-binary @- http://127.0.0.1:8081/api/login)" = 401
          curl --fail --silent http://127.0.0.1:8081/readyz | jq -e '.storage=="postgresql18"' >/dev/null

      - name: Back up offline Go PG18 and restore into an independent PG18 container
        env:
          DBSPHERE_GO_CONFIG_DIR: ${{ runner.temp }}/dbsphere-go-offline-config
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-offline-output/DbSphere-go-offline-*.run)
          test "${#archive[@]}" -eq 1
          bash "${archive[0]}" --backup "$RUNNER_TEMP/dbsphere-go-backup"
          dump=("$RUNNER_TEMP"/dbsphere-go-backup/*.dump)
          manifest=("$RUNNER_TEMP"/dbsphere-go-backup/*.json)
          test "${#dump[@]}" -eq 1 && test "${#manifest[@]}" -eq 1
          test "$(sha256sum "${dump[0]}" | cut -d ' ' -f 1)" = "$(jq -er .sha256 "${manifest[0]}")"
          docker run -d --pull never --name dbsphere-go-restore-ci -e POSTGRES_PASSWORD=restore-ci-password postgres:18-bookworm
          trap 'docker rm -f dbsphere-go-restore-ci >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec dbsphere-go-restore-ci pg_isready -h 127.0.0.1 -U postgres -d postgres >/dev/null; then break; fi
            sleep 1
          done
          docker exec dbsphere-go-restore-ci pg_isready -h 127.0.0.1 -U postgres -d postgres >/dev/null
          docker exec -e PGPASSWORD=restore-ci-password -i dbsphere-go-restore-ci \
            pg_restore -h 127.0.0.1 -U postgres -d postgres --no-owner --no-acl < "${dump[0]}"
          version="$(docker exec -e PGPASSWORD=restore-ci-password dbsphere-go-restore-ci \
            psql -h 127.0.0.1 -U postgres -d postgres -Atqc 'SELECT max(version) FROM dbsphere_schema_migrations')"
          test "$version" -ge 20
      - name: Install with a network-isolated Docker 27 daemon and preserve PG18 data
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-offline-output/DbSphere-go-offline-*.run)
          test "${#archive[@]}" -eq 1
          previous_dir="$RUNNER_TEMP/dbsphere-previous-airgap"
          mkdir -p "$previous_dir"
          previous_version='1.28.0'
          previous_sha='b36053e0c3440f3de5704e0cced0a6d5aeb19226ff56478d7440f30aee9cc6a9'
          previous="$previous_dir/DbSphere-go-offline-$previous_version-linux-amd64.run"
          curl -fL --retry 3 --output "$previous" \
            "https://github.com/cuipengdba/DbSphere/releases/download/v$previous_version/$(basename "$previous")"
          printf '%s  %s\n' "$previous_sha" "$(basename "$previous")" > "$previous.sha256"
          (cd "$previous_dir" && sha256sum --check --strict "$(basename "$previous.sha256")")
          bash scripts/go-offline-nested-airgap-smoke.sh "${archive[0]}" "$previous"
      - name: Switch to systemd with the same external PostgreSQL 18 store
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-native/DbSphere-go-systemd-*.run)
          test "${#archive[@]}" -eq 1
          bash scripts/go-systemd-smoke.sh "${archive[0]}" | tee "$RUNNER_TEMP/native-amd64-proof.log"
      - uses: actions/upload-artifact@v4
        with:
          name: dbsphere-native-amd64-proof
          path: ${{ runner.temp }}/native-amd64-proof.log
          if-no-files-found: error
      - name: Preserve tested Go offline and native packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dbsphere-go-tested-packages
          path: |
            ${{ runner.temp }}/dbsphere-go-offline-output/DbSphere-go-offline-*.run
            ${{ runner.temp }}/dbsphere-go-offline-output/DbSphere-go-offline-*.run.sha256
            ${{ runner.temp }}/dbsphere-go-native/DbSphere-go-*-linux-amd64
            ${{ runner.temp }}/dbsphere-go-native/DbSphere-go-*-linux-amd64.sha256
            ${{ runner.temp }}/dbsphere-go-native/DbSphere-go-licenses-*.tar.gz
            ${{ runner.temp }}/dbsphere-go-native/DbSphere-go-licenses-*.tar.gz.sha256
            ${{ runner.temp }}/dbsphere-go-native/DbSphere-go-systemd-*.run
            ${{ runner.temp }}/dbsphere-go-native/DbSphere-go-systemd-*.run.sha256
          if-no-files-found: error

  go-offline-package-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and check the arm64 Go and PostgreSQL 18 bundle
        run: |
          test "$(uname -m)" = aarch64
          version="$(jq -er .version package.json)"
          out="$RUNNER_TEMP/dbsphere-go-arm64"
          bash scripts/build-go-offline-bundle.sh "$out"
          postgres_arch="$(docker run --rm --platform linux/arm64 --pull never --entrypoint uname postgres:18-bookworm -m)"
          echo "PostgreSQL kernel architecture: $postgres_arch"
          test "$postgres_arch" = aarch64
          binary="$out/DbSphere-go-$version-linux-arm64"
          container="$(docker create "dbsphere/offline-go-app:$version")"
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/dbsphere" "$binary"
          chmod 0755 "$binary"
          file -b "$binary"
          binary_machine="$(readelf -h "$binary" | awk -F: '/Machine:/ {gsub(/^[[:space:]]+/, "", $2); print $2}')"
          echo "DbSphere ELF machine: $binary_machine"
          test "$binary_machine" = AArch64
          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo 'DbSphere unexpectedly requires a dynamic linker' >&2
            exit 1
          fi
          (cd "$out" && sha256sum "$(basename "$binary")" > "$(basename "$binary").sha256")
          bash scripts/build-go-systemd-bundle.sh "$binary" "$out"
          (cd "$out" && sha256sum --check --strict ./*.sha256)
      - name: Upgrade and roll back arm64 with an offline Docker daemon
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-arm64/DbSphere-go-offline-*.run)
          test "${#archive[@]}" -eq 1
          previous_dir="$RUNNER_TEMP/dbsphere-arm64-previous"
          previous_version='1.28.0'
          previous_arm_sha='c24509ecac46e8b2f7cdb7e1155528eb754f48ef82a496c078f8e4ca95880de9'
          previous="$previous_dir/DbSphere-go-offline-$previous_version-linux-arm64.run"
          mkdir -p "$previous_dir"
          if [[ -n "$previous_arm_sha" ]]; then
            curl -fL --retry 3 --output "$previous" \
              "https://github.com/cuipengdba/DbSphere/releases/download/v$previous_version/$(basename "$previous")"
            printf '%s  %s\n' "$previous_arm_sha" "$(basename "$previous")" > "$previous.sha256"
          else
            # v1.24.0 had no published arm64 artifact. Only its packaging scripts
            # are replaced so the exact previous application can run on arm64.
            test "$previous_version" = 1.24.0
            previous_source="$RUNNER_TEMP/dbsphere-arm64-previous-source"
            mkdir -p "$previous_source"
            git archive "v$previous_version" | tar -x -C "$previous_source"
            cp scripts/{build-go-offline-bundle,install-go-offline}.sh "$previous_source/scripts/"
            bash "$previous_source/scripts/build-go-offline-bundle.sh" "$previous_dir"
          fi
          (cd "$previous_dir" && sha256sum --check --strict "$(basename "$previous.sha256")")
          bash scripts/go-offline-nested-airgap-smoke.sh "${archive[0]}" "$previous" | tee "$RUNNER_TEMP/arm64-airgap-proof.log"
      - name: Switch arm64 to systemd with the same external PostgreSQL 18 store
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-arm64/DbSphere-go-systemd-*.run)
          test "${#archive[@]}" -eq 1
          bash scripts/go-systemd-smoke.sh "${archive[0]}" | tee "$RUNNER_TEMP/native-arm64-proof.log"
      - uses: actions/upload-artifact@v4
        with:
          name: dbsphere-native-arm64-proof
          path: |
            ${{ runner.temp }}/arm64-airgap-proof.log
            ${{ runner.temp }}/native-arm64-proof.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dbsphere-go-arm64-tested-packages
          path: ${{ runner.temp }}/dbsphere-go-arm64/*
          if-no-files-found: error

  go-external-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify external PostgreSQL 18 offline deployment and outage recovery
        run: |
          bash -n scripts/go-external-store-smoke.sh
          bash scripts/go-external-store-smoke.sh "$RUNNER_TEMP/dbsphere-go-external"

  container-vulnerability-inventory:
    needs: go-offline-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dbsphere-offline-image-sboms
          path: ${{ runner.temp }}/dbsphere-image-sboms
      - name: Scan both bundled image SBOMs with pinned Grype
        run: |
          export GRYPE_DB_CACHE_DIR="$RUNNER_TEMP/dbsphere-grype-db"
          export GRYPE_CHECK_FOR_APP_UPDATE=false
          mkdir -p "$RUNNER_TEMP/dbsphere-grype"
          curl -fLsS -o "$RUNNER_TEMP/dbsphere-grype/grype.tar.gz" \
            https://github.com/anchore/grype/releases/download/v0.122.1/grype_0.122.1_linux_amd64.tar.gz
          printf '%s  %s\n' \
            f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538 \
            "$RUNNER_TEMP/dbsphere-grype/grype.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dbsphere-grype/grype.tar.gz" -C "$RUNNER_TEMP/dbsphere-grype" grype
          "$RUNNER_TEMP/dbsphere-grype/grype" \
            "sbom:$RUNNER_TEMP/dbsphere-image-sboms/dbsphere-go-image.cdx.json" \
            --output json > "$RUNNER_TEMP/dbsphere-go-image-vulnerabilities.json"
          "$RUNNER_TEMP/dbsphere-grype/grype" \
            "sbom:$RUNNER_TEMP/dbsphere-image-sboms/dbsphere-postgres18-image.cdx.json" \
            --output json > "$RUNNER_TEMP/dbsphere-postgres18-image-vulnerabilities.json"
          jq -e '.matches | type == "array"' \
            "$RUNNER_TEMP/dbsphere-go-image-vulnerabilities.json" >/dev/null
          jq -e '.matches | type == "array"' \
            "$RUNNER_TEMP/dbsphere-postgres18-image-vulnerabilities.json" >/dev/null
          jq -n --slurpfile app "$RUNNER_TEMP/dbsphere-go-image-vulnerabilities.json" \
            --slurpfile store "$RUNNER_TEMP/dbsphere-postgres18-image-vulnerabilities.json" \
            '{go_matches:($app[0].matches|length),postgres18_matches:($store[0].matches|length)}'
      - name: Enforce reviewed critical vulnerability inventory
        run: |
          jq -e '[.matches[] | select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High")] | length == 0' \
            "$RUNNER_TEMP/dbsphere-go-image-vulnerabilities.json" >/dev/null
          jq -e '[.matches[] | select(.vulnerability.severity == "Critical") | .vulnerability.id] | unique | sort == [
            "CVE-2025-7458", "CVE-2026-5450", "CVE-2026-6653",
            "GO-2026-4337", "GO-2026-6604", "GO-2026-6612"
          ]' "$RUNNER_TEMP/dbsphere-postgres18-image-vulnerabilities.json" >/dev/null
      - name: Preserve container vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbsphere-offline-image-vulnerability-reports
          path: |
            ${{ runner.temp }}/dbsphere-go-image-vulnerabilities.json
            ${{ runner.temp }}/dbsphere-postgres18-image-vulnerabilities.json
          if-no-files-found: warn

  go-offline-upgrade-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Drill Go offline upgrade and rollback with one persistent PG18 event
        run: |
