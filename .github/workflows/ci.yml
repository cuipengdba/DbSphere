        run: node scripts/pg-inspections-smoke.mjs
      - name: Detect real PostgreSQL 18 replication slot WAL retention
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-inspection-slot-smoke.mjs
      - name: Drill PostgreSQL 18 monitoring store backup and restore
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_TMP_DIR: ${{ runner.temp }}
        run: node scripts/pg18-backup-restore-drill.mjs
      - name: Test PostgreSQL 18 alert event correlation
