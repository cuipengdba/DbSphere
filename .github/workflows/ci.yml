  sql-performance-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18, 19]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL and monitoring role
        run: |
          extra=()
          if [[ '${{ matrix.pg }}' == '18' ]]; then
            extra=(-c compute_query_id=on -c logging_collector=on \
              -c log_destination=jsonlog -c log_directory=log \
              -c log_filename=dbsphere-json.log -c log_min_duration_statement=1000)
          fi
          docker run -d --rm --name dbsphere-sql-pg -p 15432:5432 \
            -e POSTGRES_PASSWORD=dbsphere-root-test postgres:${{ matrix.pg }}-bookworm \
            -c shared_preload_libraries=pg_stat_statements "${extra[@]}"
          for i in $(seq 1 60); do
            if docker exec dbsphere-sql-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-sql-pg \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
      - name: Degrade gracefully without extension
        env:
          DBSPHERE_TEST_PG_MAJOR: ${{ matrix.pg }}
          DBSPHERE_SQL_EXPECTED: not_configured
        run: node scripts/pg-sql-performance-smoke.mjs
      - name: Verify diagnostics and one-event real lock RCA
        env:
          DBSPHERE_TEST_PG_MAJOR: ${{ matrix.pg }}
          DBSPHERE_TEST_TMP_DIR: ${{ runner.temp }}
        run: node scripts/pg-compat.mjs
      - name: Enable pg_stat_statements
        run: |
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-sql-pg \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION pg_stat_statements;'
      - name: Collect real Top SQL counters
        env:
          DBSPHERE_TEST_PG_MAJOR: ${{ matrix.pg }}
        run: node scripts/pg-sql-performance-smoke.mjs
      - name: Verify Go query fingerprints without SQL text
        env:
          DBSPHERE_TEST_SQL_ENABLED: '1'
          DBSPHERE_TEST_PG_TARGET_PORT: '15432'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-root-test
          DBSPHERE_TEST_PG_TARGET_MAJOR: ${{ matrix.pg }}
        run: go test ./internal/collector -run TestSQLPerformanceEnabledWithoutRawSQL -count=1 -v
      - name: Capture and replay a two-hop lock incident on PostgreSQL
        env:
          DBSPHERE_TEST_PG_MAJOR: ${{ matrix.pg }}
          DBSPHERE_TEST_BASE: http://127.0.0.1:18089
          DBSPHERE_WAIT_CAPTURE_PROOF: ${{ runner.temp }}/wait-capture-pg${{ matrix.pg }}.json
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-wait-store@127.0.0.1:15438/postgres
          DBSPHERE_ADMIN_PASSWORD: dbsphere-wait-admin-fixture
          DBSPHERE_PORT: '18089'
        run: |
          docker run -d --rm --name dbsphere-wait-store -p 127.0.0.1:15438:5432 \
            -e POSTGRES_PASSWORD=dbsphere-wait-store postgres:18-bookworm
          trap 'docker stop dbsphere-wait-store >/dev/null' EXIT
          for i in {1..40}; do
            if docker exec dbsphere-wait-store pg_isready -h 127.0.0.1 -U postgres >/dev/null; then break; fi
            sleep 1
          done
          export DBSPHERE_MASTER_KEY="$(openssl rand -base64 32)"
          go build -o "$RUNNER_TEMP/dbsphere-wait" ./cmd/dbsphere
          "$RUNNER_TEMP/dbsphere-wait" > "$RUNNER_TEMP/dbsphere-wait.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; docker stop dbsphere-wait-store >/dev/null' EXIT
          for i in {1..30}; do
            if curl -fs "$DBSPHERE_TEST_BASE/readyz" >/dev/null; then break; fi
            sleep 1
          done
          if ! node scripts/pg-wait-capture-acceptance.mjs; then
            tail -n 30 "$RUNNER_TEMP/dbsphere-wait.log"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dbsphere-wait-capture-pg${{ matrix.pg }}
          path: ${{ runner.temp }}/wait-capture-pg${{ matrix.pg }}.json
          if-no-files-found: error
      - name: Detect a real SQL latency regression
        if: matrix.pg == 18
        run: node scripts/pg-sql-regression-smoke.mjs
      - name: Verify real Go SQL regression opens and recovers one incident
        if: matrix.pg == 18
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-root-test@127.0.0.1:15432/postgres
          DBSPHERE_TEST_PG_TARGET_PORT: '15432'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-root-test
          DBSPHERE_TEST_PG_TARGET_MAJOR: '18'
          DBSPHERE_TEST_REAL_SQL_REGRESSION: '1'
        run: go test ./internal/store -run '^TestRealPG18SQLRegressionOpensAndRecoversOneIncident$' -count=1 -v
      - name: Verify real PG18 plan and jsonlog corroborate the same SQL incident
        if: matrix.pg == 18
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-root-test@127.0.0.1:15432/postgres
          DBSPHERE_TEST_PG_TARGET_PORT: '15432'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-root-test
          DBSPHERE_TEST_PG_TARGET_MAJOR: '18'
          DBSPHERE_TEST_REAL_SQL_PLAN: '1'
        run: go test ./internal/store -run '^TestRealPG18SQLRegressionLinksRealPlanAndSlowLog$' -count=1 -v -timeout 10m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Linux native startup and restart smoke test
        run: node scripts/linux-smoke.mjs
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  pg18-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
