name: CI

on:
  push:
  pull_request:

jobs:
  go-foundation:
    runs-on: ubuntu-latest
    services:
      pg18:
        image: postgres:18-bookworm
        ports:
          - 15434:5432
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/otel-sdk-probe/go.sum
      - name: Test and vet Go foundation against PostgreSQL 18
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: |
          go test -p 1 ./...
          go vet ./...
      - name: Build official OpenTelemetry Go SDK acceptance probe
        run: |
          cd examples/otel-sdk-probe
          go test ./...
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/dbsphere-otel-sdk-probe" .
      - name: Build and start Go binary with embedded static pages
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_ADMIN_PASSWORD: first-bootstrap-password
          DBSPHERE_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DBSPHERE_HOST: 127.0.0.1
          DBSPHERE_PORT: '18085'
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/dbsphere-go" ./cmd/dbsphere
          "$RUNNER_TEMP/dbsphere-go" > "$RUNNER_TEMP/dbsphere-go.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18085/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18085/healthz
          curl --fail --silent http://127.0.0.1:18085/readyz
          curl --fail --silent http://127.0.0.1:18085/api/version | grep '"backend":"go"'
          curl --fail --silent http://127.0.0.1:18085/ | grep 'DbSphere'
          curl --fail --silent -c "$RUNNER_TEMP/dbsphere-go-cookies" \
            -H 'Content-Type: application/json' \
            -d '{"password":"first-bootstrap-password"}' \
            http://127.0.0.1:18085/api/login | grep '"authenticated":true'
          curl --fail --silent -b "$RUNNER_TEMP/dbsphere-go-cookies" \
            http://127.0.0.1:18085/api/session | grep '"authenticated":true'

  go-pg-compat-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18']
    services:
      store:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      target:
        image: postgres:${{ matrix.pg }}-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-target-test
        ports:
          - 15435:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify Go collection, event linkage and real HTTP lock Trace on PostgreSQL ${{ matrix.pg }}
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_PG_TARGET_PORT: '15435'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-target-test
          DBSPHERE_TEST_PG_TARGET_MAJOR: ${{ matrix.pg }}
        run: go test ./internal/collector ./internal/store ./examples/trace-lock-app -count=1 -v

  offline-upgrade-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Drill offline upgrade and application rollback with persistent PG18
        run: bash scripts/offline-upgrade-rollback-smoke.sh "$RUNNER_TEMP/dbsphere-offline-upgrade"

  native-offline-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build native Node.js offline package
        run: bash scripts/build-node-offline-bundle.sh "$RUNNER_TEMP/dbsphere-node-output"
      - name: Start B/S from offline package without package manager
        env:
          DBSPHERE_CONFIG_DIR: ${{ runner.temp }}/dbsphere-node-config
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_PORT: '8090'
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          docker run -d --rm --name dbsphere-node-offline-store -p 15434:5432 \
            -e POSTGRES_PASSWORD=dbsphere-store-test postgres:18-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-node-offline-store pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/dbsphere-node-extracted"
          archive=("$RUNNER_TEMP"/dbsphere-node-output/DbSphere-node-*.tar.gz)
          test "${#archive[@]}" -eq 1
          tar -xzf "${archive[0]}" -C "$RUNNER_TEMP/dbsphere-node-extracted"
          bash "$RUNNER_TEMP/dbsphere-node-extracted/run.sh" > "$RUNNER_TEMP/dbsphere-node.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8090/readyz >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat "$RUNNER_TEMP/dbsphere-node.log"; exit 1; fi
          test -f "$DBSPHERE_CONFIG_DIR/dbsphere.env"
          curl --fail --silent http://127.0.0.1:8090/readyz

  offline-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build offline one-click package on Linux
        run: bash scripts/build-offline-bundle.sh "$RUNNER_TEMP/dbsphere-offline-output"
      - name: Install with local images only
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
          DBSPHERE_CONFIG_DIR: ${{ runner.temp }}/dbsphere-offline-config
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-offline-output/DbSphere-offline-*.run)
          test "${#archive[@]}" -eq 1
          version="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          docker image rm "dbsphere/offline-app:$version" postgres:18-bookworm
          if docker image inspect "dbsphere/offline-app:$version" >/dev/null 2>&1; then exit 1; fi
          bash "${archive[0]}"
          curl --fail --silent http://127.0.0.1:8080/readyz
          docker image inspect "dbsphere/offline-app:$version" postgres:18-bookworm >/dev/null
          bash "${archive[0]}"
          curl --fail --silent http://127.0.0.1:8080/readyz

  go-offline-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Go deployment scripts
        run: bash -n scripts/one-click-go.sh scripts/build-go-offline-bundle.sh scripts/install-go-offline.sh scripts/backup-go-store.sh
      - name: Build Go static container and PostgreSQL 18 offline bundle
        run: bash scripts/build-go-offline-bundle.sh "$RUNNER_TEMP/dbsphere-go-offline-output"
      - name: Install Go container twice from local images
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
          DBSPHERE_GO_CONFIG_DIR: ${{ runner.temp }}/dbsphere-go-offline-config
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-offline-output/DbSphere-go-offline-*.run)
          test "${#archive[@]}" -eq 1
          version="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          docker image rm "dbsphere/offline-go-app:$version" postgres:18-bookworm
          if docker image inspect "dbsphere/offline-go-app:$version" >/dev/null 2>&1; then exit 1; fi
          bash "${archive[0]}"
          curl --fail --silent http://127.0.0.1:8081/readyz
          curl --fail --silent http://127.0.0.1:8081/ | grep 'DbSphere'
          docker image inspect "dbsphere/offline-go-app:$version" postgres:18-bookworm >/dev/null
          bash "${archive[0]}"
          curl --fail --silent http://127.0.0.1:8081/readyz

      - name: Rotate Go offline administrator password and revoke old session
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
          DBSPHERE_GO_CONFIG_DIR: ${{ runner.temp }}/dbsphere-go-offline-config
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-offline-output/DbSphere-go-offline-*.run)
          test "${#archive[@]}" -eq 1
          env_file="$DBSPHERE_GO_CONFIG_DIR/dbsphere-go.env"
          old_password="$(sed -n 's/^DBSPHERE_ADMIN_PASSWORD=//p' "$env_file" | head -n 1)"
          jq -nc --arg password "$old_password" '{password:$password}' |
            curl --fail --silent --show-error -c "$RUNNER_TEMP/dbsphere-old-admin-cookie" \
              -H 'Content-Type: application/json' --data-binary @- http://127.0.0.1:8081/api/login >/dev/null
          new_password='dbsphere-rotated-ci-password'
          sed -i "s/^DBSPHERE_ADMIN_PASSWORD=.*/DBSPHERE_ADMIN_PASSWORD=$new_password/" "$env_file"
          bash "${archive[0]}" --rotate-admin-password
          jq -nc --arg password "$new_password" '{password:$password}' |
            curl --fail --silent --show-error -H 'Content-Type: application/json' \
              --data-binary @- http://127.0.0.1:8081/api/login | jq -e '.role=="admin"' >/dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' \
            -b "$RUNNER_TEMP/dbsphere-old-admin-cookie" http://127.0.0.1:8081/api/assets)" = 401
          test "$(jq -nc --arg password "$old_password" '{password:$password}' |
            curl --silent -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
              --data-binary @- http://127.0.0.1:8081/api/login)" = 401
          curl --fail --silent http://127.0.0.1:8081/readyz | jq -e '.storage=="postgresql18"' >/dev/null

      - name: Back up offline Go PG18 and restore into an independent PG18 container
        env:
          DBSPHERE_GO_CONFIG_DIR: ${{ runner.temp }}/dbsphere-go-offline-config
        run: |
          archive=("$RUNNER_TEMP"/dbsphere-go-offline-output/DbSphere-go-offline-*.run)
          test "${#archive[@]}" -eq 1
          bash "${archive[0]}" --backup "$RUNNER_TEMP/dbsphere-go-backup"
          dump=("$RUNNER_TEMP"/dbsphere-go-backup/*.dump)
          manifest=("$RUNNER_TEMP"/dbsphere-go-backup/*.json)
          test "${#dump[@]}" -eq 1 && test "${#manifest[@]}" -eq 1
          test "$(sha256sum "${dump[0]}" | cut -d ' ' -f 1)" = "$(jq -er .sha256 "${manifest[0]}")"
          docker run -d --pull never --name dbsphere-go-restore-ci -e POSTGRES_PASSWORD=restore-ci-password postgres:18-bookworm
          trap 'docker rm -f dbsphere-go-restore-ci >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec dbsphere-go-restore-ci pg_isready -U postgres -d postgres >/dev/null; then break; fi
            sleep 1
          done
          docker exec -i dbsphere-go-restore-ci pg_restore -U postgres -d postgres --no-owner --no-acl < "${dump[0]}"
          version="$(docker exec dbsphere-go-restore-ci psql -U postgres -d postgres -Atqc 'SELECT max(version) FROM dbsphere_schema_migrations')"
          test "$version" -ge 19

  go-offline-upgrade-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Drill Go offline upgrade and rollback with one persistent PG18 event
        run: |
          bash -n scripts/go-offline-upgrade-rollback-smoke.sh
          bash scripts/go-offline-upgrade-rollback-smoke.sh "$RUNNER_TEMP/dbsphere-go-upgrade"

  sql-performance-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL and monitoring role
        run: |
          docker run -d --rm --name dbsphere-sql-pg -p 15432:5432 \
            -e POSTGRES_PASSWORD=dbsphere-root-test postgres:${{ matrix.pg }}-bookworm \
            -c shared_preload_libraries=pg_stat_statements
          for i in $(seq 1 60); do
            if docker exec dbsphere-sql-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-sql-pg \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
      - name: Degrade gracefully without extension
        env:
          DBSPHERE_TEST_PG_MAJOR: ${{ matrix.pg }}
          DBSPHERE_SQL_EXPECTED: not_configured
        run: node scripts/pg-sql-performance-smoke.mjs
      - name: Verify diagnostics and one-event real lock RCA
        env:
          DBSPHERE_TEST_PG_MAJOR: ${{ matrix.pg }}
          DBSPHERE_TEST_TMP_DIR: ${{ runner.temp }}
        run: node scripts/pg-compat.mjs
      - name: Enable pg_stat_statements
        run: |
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-sql-pg \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION pg_stat_statements;'
      - name: Collect real Top SQL counters
        env:
          DBSPHERE_TEST_PG_MAJOR: ${{ matrix.pg }}
        run: node scripts/pg-sql-performance-smoke.mjs
      - name: Verify Go query fingerprints without SQL text
        env:
          DBSPHERE_TEST_SQL_ENABLED: '1'
          DBSPHERE_TEST_PG_TARGET_PORT: '15432'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-root-test
          DBSPHERE_TEST_PG_TARGET_MAJOR: ${{ matrix.pg }}
        run: go test ./internal/collector -run TestSQLPerformanceEnabledWithoutRawSQL -count=1 -v
      - name: Detect a real SQL latency regression
        if: matrix.pg == 18
        run: node scripts/pg-sql-regression-smoke.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Linux native startup and restart smoke test
        run: node scripts/linux-smoke.mjs
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  pg18-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Test PostgreSQL 18 persistence
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_DATA_DIR: ${{ runner.temp }}/dbsphere-pgstore-smoke
        run: node scripts/pg-store-smoke.mjs
      - name: Test SQLite migration to PostgreSQL 18
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_DATA_DIR: ${{ runner.temp }}/dbsphere-migration-smoke
        run: node scripts/migration-smoke.mjs
      - name: Test PostgreSQL 18 alert rule persistence
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-alert-rules-smoke.mjs
      - name: Test PostgreSQL 18 versioned inspections
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-inspections-smoke.mjs
      - name: Detect real PostgreSQL 18 replication slot WAL retention
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-inspection-slot-smoke.mjs
      - name: Drill PostgreSQL 18 monitoring store backup and restore
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_TMP_DIR: ${{ runner.temp }}
        run: node scripts/pg18-backup-restore-drill.mjs
      - name: Test PostgreSQL 18 alert event correlation
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-alert-events-smoke.mjs
      - name: Link OTLP PostgreSQL client spans to a PG18 event
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg18-trace-smoke.mjs
      - name: Test PostgreSQL 18 alert silences
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-alert-silences-smoke.mjs
      - name: Test PostgreSQL 18 notification delivery and escalation
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-alert-notifications-smoke.mjs
      - name: Test PostgreSQL 18 sample partitions and retention
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-storage-retention-smoke.mjs
      - name: Upgrade a pre-partition PostgreSQL 18 sample table
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-sample-upgrade-smoke.mjs
      - name: Reject a PostgreSQL 17 long-term store
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15437/postgres
        run: |
          docker run -d --rm --name dbsphere-wrong-store -p 15437:5432 \
            -e POSTGRES_PASSWORD=dbsphere-store-test postgres:17-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-wrong-store pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node scripts/reject-non18-store.mjs

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and start one-click stack
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: bash scripts/one-click.sh
      - name: Check B/S service
        run: |
          curl --fail --silent http://127.0.0.1:8080/readyz
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml ps
      - name: Onboard a real PostgreSQL 14 target
        run: |
          docker run -d --rm --name dbsphere-compose-pg14 -p 15435:5432 \
            -e POSTGRES_PASSWORD=dbsphere-root-test postgres:14-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-compose-pg14 pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-compose-pg14 \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
          node scripts/compose-pg-target-smoke.mjs
      - name: Check persistence and storage outage
        run: node scripts/compose-smoke.mjs
      - name: Check one-click K8S kubeconfig mount
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          printf 'DBSPHERE_KUBECONFIG_HOST_PATH=%s\n' "$PWD/test/fixtures/k8s-postgres.yaml" >> deploy/compose/.env
          bash scripts/one-click.sh
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml \
            -f deploy/compose/compose.k8s.yaml exec -T app test -r /etc/dbsphere/kubeconfig
          node scripts/compose-upgrade-smoke.mjs
      - name: Check one-click read-only backup info mount
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/dbsphere-backup-info"
          printf 'DBSPHERE_BACKUP_INFO_HOST_PATH=%s\n' "$RUNNER_TEMP/dbsphere-backup-info" >> deploy/compose/.env
          bash scripts/one-click.sh
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml \
            -f deploy/compose/compose.k8s.yaml -f deploy/compose/compose.backup.yaml \
            exec -T app test -d /etc/dbsphere/backup-info
      - name: Check monitoring store backup manifest mount
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          bash scripts/backup-store.sh "$RUNNER_TEMP/dbsphere-monitor-backup"
          test -s "$RUNNER_TEMP/dbsphere-monitor-backup/monitor-store-backup.json"
          printf 'DBSPHERE_STORE_BACKUP_HOST_PATH=%s\n' "$RUNNER_TEMP/dbsphere-monitor-backup/monitor-store-backup.json" >> deploy/compose/.env
          bash scripts/one-click.sh
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml \
            -f deploy/compose/compose.k8s.yaml -f deploy/compose/compose.backup.yaml \
            -f deploy/compose/compose.store-backup.yaml exec -T app test -r /etc/dbsphere/store-backup.json
          node scripts/compose-store-backup-smoke.mjs
      - name: Reject an invalid kubeconfig path clearly
        run: |
          printf 'DBSPHERE_KUBECONFIG_HOST_PATH=/definitely/missing/kubeconfig\n' >> deploy/compose/.env
          if bash scripts/one-click.sh > "$RUNNER_TEMP/dbsphere-invalid-config.log" 2>&1; then exit 1; fi
          grep -q 'DBSPHERE_KUBECONFIG_HOST_PATH must be an existing absolute file path' \
            "$RUNNER_TEMP/dbsphere-invalid-config.log"

  replication-lag-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate and build isolated Go replication drill
        run: |
          bash -n test/replication-drill/primary-init.sh test/replication-drill/replica-init.sh
          node --check scripts/replication-drill-secrets.mjs
          node --check scripts/replication-drill-acceptance.mjs
          node --check scripts/replication-drill-verify.mjs
          node scripts/replication-drill-secrets.mjs \
            "$RUNNER_TEMP/dbsphere-replication.env" "$RUNNER_TEMP/dbsphere-replication-credentials.json"
          docker build -f Dockerfile-go -t dbsphere/replication-drill:local .
          docker compose --env-file "$RUNNER_TEMP/dbsphere-replication.env" \
            -f test/replication-drill/compose.yaml config --quiet
      - name: Start PG18 primary, standby, store and Go service
        run: |
          docker compose --env-file "$RUNNER_TEMP/dbsphere-replication.env" \
            -f test/replication-drill/compose.yaml up -d --wait --wait-timeout 300
          curl --fail --silent http://127.0.0.1:18092/readyz | jq -e '.storage=="postgresql18"' >/dev/null
      - name: Verify real lag incident, recovery and restart persistence
        run: |
          node scripts/replication-drill-acceptance.mjs http://127.0.0.1:18092 \
            "$RUNNER_TEMP/dbsphere-replication-credentials.json" > "$RUNNER_TEMP/dbsphere-replication-result.json"
          node scripts/replication-drill-verify.mjs http://127.0.0.1:18092 \
            "$RUNNER_TEMP/dbsphere-replication-credentials.json" "$RUNNER_TEMP/dbsphere-replication-result.json"
          docker compose --env-file "$RUNNER_TEMP/dbsphere-replication.env" \
            -f test/replication-drill/compose.yaml up -d --no-deps --force-recreate app
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:18092/readyz 2>/dev/null |
              jq -e '.storage=="postgresql18"' >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18092/readyz | jq -e '.storage=="postgresql18"' >/dev/null
          node scripts/replication-drill-verify.mjs http://127.0.0.1:18092 \
            "$RUNNER_TEMP/dbsphere-replication-credentials.json" "$RUNNER_TEMP/dbsphere-replication-result.json"
          cat "$RUNNER_TEMP/dbsphere-replication-result.json"
      - name: Remove isolated replication drill
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dbsphere-replication.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/dbsphere-replication.env" \
              -f test/replication-drill/compose.yaml down -v --remove-orphans
          fi

  external-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start independent PostgreSQL 18
        run: |
          docker run -d --rm --network host --name dbsphere-external-pgtest \
            -e POSTGRES_USER=dbsphere -e POSTGRES_DB=dbsphere \
            -e POSTGRES_PASSWORD=dbsphere-external-test \
            postgres:18-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-external-pgtest pg_isready -h 127.0.0.1 -U dbsphere -d dbsphere >/dev/null 2>&1; then break; fi
            sleep 1
          done
      - name: One-click external PG18 mode
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          umask 077
          printf 'DBSPHERE_ADMIN_PASSWORD=dbsphere-external-admin-test\nDBSPHERE_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\nDBSPHERE_DATABASE_URL=postgres://dbsphere:dbsphere-external-test@host.docker.internal:5432/dbsphere\nDBSPHERE_WEB_PORT=8080\n' > deploy/compose/.env
          bash scripts/one-click.sh
          curl --fail --silent http://127.0.0.1:8080/readyz

  linux-exporter:
    runs-on: ubuntu-latest
    services:
      store:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL 14 and node_exporter
        run: |
          docker run -d --rm --name dbsphere-linux-pgtest -p 15435:5432 \
            -e POSTGRES_PASSWORD=dbsphere-root-test postgres:14-bookworm
          docker run -d --rm --name dbsphere-linux-exporter -p 19100:9100 \
            --pid host -v /:/host:ro,rslave quay.io/prometheus/node-exporter:v1.12.1 \
            --path.rootfs=/host
          for i in $(seq 1 60); do
            if docker exec dbsphere-linux-pgtest pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-linux-pgtest \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
          curl --fail --silent http://127.0.0.1:19100/metrics >/dev/null
      - name: Check cross-layer collection and restart persistence
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_DATA_DIR: ${{ runner.temp }}/dbsphere-linux-exporter-smoke
          DBSPHERE_TEST_PG_PORT: '15435'
          DBSPHERE_TEST_EXPORTER_PORT: '19100'
        run: node scripts/linux-exporter-smoke.mjs
      - name: Keep Linux evidence in one Go PostgreSQL failure event
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_PG_TARGET_PORT: '15435'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-root-test
          DBSPHERE_TEST_NODE_EXPORTER_PORT: '19100'
        run: go test ./internal/collector ./internal/store -run 'TestRealNodeExporter|TestLinuxEvidenceSurvivesPostgresConnectionFailure' -count=1 -v

  pgbouncer:
    runs-on: ubuntu-latest
    services:
      store:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL 14 and PgBouncer
        run: |
          docker network create dbsphere-pooltest
          docker run -d --rm --name dbsphere-pg14-pooltest --network dbsphere-pooltest \
            -p 15435:5432 -e POSTGRES_PASSWORD=dbsphere-root-test postgres:14-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-pg14-pooltest pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-pg14-pooltest \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
          docker run -d --rm --name dbsphere-pooler-pgtest --network dbsphere-pooltest \
            -p 16433:5432 -e DB_USER=dbsphere_monitor -e DB_PASSWORD=dbsphere-monitor-test \
            -e DB_HOST=dbsphere-pg14-pooltest -e DB_NAME=postgres \
            -e STATS_USERS=dbsphere_monitor -e AUTH_TYPE=scram-sha-256 \
            edoburu/pgbouncer:v1.26.1-p0
          for i in $(seq 1 60); do
            if docker exec dbsphere-pooler-pgtest pg_isready -h 127.0.0.1 -U dbsphere_monitor -d pgbouncer >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-monitor-test dbsphere-pg14-pooltest \
            psql -h dbsphere-pooler-pgtest -U dbsphere_monitor -d postgres -v ON_ERROR_STOP=1 -c 'SELECT 1'
      - name: Check PgBouncer metrics and PG18 persistence
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_DATA_DIR: ${{ runner.temp }}/dbsphere-pgbouncer-smoke
          DBSPHERE_TEST_PG_PORT: '15435'
          DBSPHERE_TEST_POOLER_PORT: '16433'
        run: node scripts/pgbouncer-smoke.mjs
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check Go PgBouncer read-only collection and PG18 sample
        env:
          DBSPHERE_TEST_PG18_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_PG_TARGET_PORT: '15435'
          DBSPHERE_TEST_PG_TARGET_PASSWORD: dbsphere-root-test
          DBSPHERE_TEST_POOLER_URL: postgres://dbsphere_monitor:dbsphere-monitor-test@127.0.0.1:16433/pgbouncer
        run: go test ./internal/collector ./internal/store -run 'TestPgBouncer|TestGoPgBouncerCombinedSampleInPG18' -count=1
