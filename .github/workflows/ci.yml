name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Linux native startup and restart smoke test
        run: node scripts/linux-smoke.mjs
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  pg18-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Test PostgreSQL 18 persistence
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_DATA_DIR: ${{ runner.temp }}/dbsphere-pgstore-smoke
        run: node scripts/pg-store-smoke.mjs
      - name: Test SQLite migration to PostgreSQL 18
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_DATA_DIR: ${{ runner.temp }}/dbsphere-migration-smoke
        run: node scripts/migration-smoke.mjs
      - name: Test PostgreSQL 18 alert rule persistence
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-alert-rules-smoke.mjs
      - name: Test PostgreSQL 18 alert event correlation
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-alert-events-smoke.mjs
      - name: Test PostgreSQL 18 alert silences
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-alert-silences-smoke.mjs
      - name: Test PostgreSQL 18 notification delivery and escalation
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
        run: node scripts/pg-alert-notifications-smoke.mjs
      - name: Reject a PostgreSQL 17 long-term store
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15437/postgres
        run: |
          docker run -d --rm --name dbsphere-wrong-store -p 15437:5432 \
            -e POSTGRES_PASSWORD=dbsphere-store-test postgres:17-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-wrong-store pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node scripts/reject-non18-store.mjs

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and start one-click stack
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: bash scripts/one-click.sh
      - name: Check B/S service
        run: |
          curl --fail --silent http://127.0.0.1:8080/readyz
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml ps
      - name: Onboard a real PostgreSQL 14 target
        run: |
          docker run -d --rm --name dbsphere-compose-pg14 -p 15435:5432 \
            -e POSTGRES_PASSWORD=dbsphere-root-test postgres:14-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-compose-pg14 pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-compose-pg14 \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
          node scripts/compose-pg-target-smoke.mjs
      - name: Check persistence and storage outage
        run: node scripts/compose-smoke.mjs
      - name: Check one-click K8S kubeconfig mount
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          printf 'DBSPHERE_KUBECONFIG_HOST_PATH=%s\n' "$PWD/test/fixtures/k8s-postgres.yaml" >> deploy/compose/.env
          bash scripts/one-click.sh
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml \
            -f deploy/compose/compose.k8s.yaml exec -T app test -r /etc/dbsphere/kubeconfig
          node scripts/compose-upgrade-smoke.mjs
      - name: Reject an invalid kubeconfig path clearly
        run: |
          printf 'DBSPHERE_KUBECONFIG_HOST_PATH=/definitely/missing/kubeconfig\n' >> deploy/compose/.env
          if bash scripts/one-click.sh > "$RUNNER_TEMP/dbsphere-invalid-config.log" 2>&1; then exit 1; fi
          grep -q 'DBSPHERE_KUBECONFIG_HOST_PATH must be an existing absolute file path' \
            "$RUNNER_TEMP/dbsphere-invalid-config.log"

  external-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start independent PostgreSQL 18
        run: |
          docker run -d --rm --network host --name dbsphere-external-pgtest \
            -e POSTGRES_USER=dbsphere -e POSTGRES_DB=dbsphere \
            -e POSTGRES_PASSWORD=dbsphere-external-test \
            postgres:18-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-external-pgtest pg_isready -h 127.0.0.1 -U dbsphere -d dbsphere >/dev/null 2>&1; then break; fi
            sleep 1
          done
      - name: One-click external PG18 mode
        env:
          DBSPHERE_NO_PRINT_PASSWORD: 'true'
        run: |
          umask 077
          printf 'DBSPHERE_ADMIN_PASSWORD=dbsphere-external-admin-test\nDBSPHERE_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\nDBSPHERE_DATABASE_URL=postgres://dbsphere:dbsphere-external-test@host.docker.internal:5432/dbsphere\nDBSPHERE_WEB_PORT=8080\n' > deploy/compose/.env
          bash scripts/one-click.sh
          curl --fail --silent http://127.0.0.1:8080/readyz

  linux-exporter:
    runs-on: ubuntu-latest
    services:
      store:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL 14 and node_exporter
        run: |
          docker run -d --rm --name dbsphere-linux-pgtest -p 15435:5432 \
            -e POSTGRES_PASSWORD=dbsphere-root-test postgres:14-bookworm
          docker run -d --rm --name dbsphere-linux-exporter -p 19100:9100 \
            --pid host -v /:/host:ro,rslave quay.io/prometheus/node-exporter:v1.12.1 \
            --path.rootfs=/host
          for i in $(seq 1 60); do
            if docker exec dbsphere-linux-pgtest pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-linux-pgtest \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
          curl --fail --silent http://127.0.0.1:19100/metrics >/dev/null
      - name: Check cross-layer collection and restart persistence
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_DATA_DIR: ${{ runner.temp }}/dbsphere-linux-exporter-smoke
          DBSPHERE_TEST_PG_PORT: '15435'
          DBSPHERE_TEST_EXPORTER_PORT: '19100'
        run: node scripts/linux-exporter-smoke.mjs

  pgbouncer:
    runs-on: ubuntu-latest
    services:
      store:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: dbsphere-store-test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL 14 and PgBouncer
        run: |
          docker network create dbsphere-pooltest
          docker run -d --rm --name dbsphere-pg14-pooltest --network dbsphere-pooltest \
            -p 15435:5432 -e POSTGRES_PASSWORD=dbsphere-root-test postgres:14-bookworm
          for i in $(seq 1 60); do
            if docker exec dbsphere-pg14-pooltest pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-root-test dbsphere-pg14-pooltest \
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dbsphere_monitor LOGIN PASSWORD 'dbsphere-monitor-test'; GRANT pg_monitor TO dbsphere_monitor;"
          docker run -d --rm --name dbsphere-pooler-pgtest --network dbsphere-pooltest \
            -p 16433:5432 -e DB_USER=dbsphere_monitor -e DB_PASSWORD=dbsphere-monitor-test \
            -e DB_HOST=dbsphere-pg14-pooltest -e DB_NAME=postgres \
            -e STATS_USERS=dbsphere_monitor -e AUTH_TYPE=scram-sha-256 \
            edoburu/pgbouncer:v1.26.1-p0
          for i in $(seq 1 60); do
            if docker exec dbsphere-pooler-pgtest pg_isready -h 127.0.0.1 -U dbsphere_monitor -d pgbouncer >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=dbsphere-monitor-test dbsphere-pg14-pooltest \
            psql -h dbsphere-pooler-pgtest -U dbsphere_monitor -d postgres -v ON_ERROR_STOP=1 -c 'SELECT 1'
      - name: Check PgBouncer metrics and PG18 persistence
        env:
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-store-test@127.0.0.1:15434/postgres
          DBSPHERE_TEST_DATA_DIR: ${{ runner.temp }}/dbsphere-pgbouncer-smoke
          DBSPHERE_TEST_PG_PORT: '15435'
          DBSPHERE_TEST_POOLER_PORT: '16433'
        run: node scripts/pgbouncer-smoke.mjs
