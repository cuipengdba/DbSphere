name: PostgreSQL history capacity

on:
  workflow_dispatch:

jobs:
  history-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      pg18:
        image: postgres:18-bookworm
        ports:
          - 15434:5432
        env:
          POSTGRES_PASSWORD: dbsphere-scale-test
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DBSPHERE_TEST_HISTORY_SCALE_URL: postgres://postgres:dbsphere-scale-test@127.0.0.1:15434/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Record Linux runner and seed 7,776,000 PostgreSQL samples
        env:
          PG18_CONTAINER: ${{ job.services.pg18.id }}
          PROOF_DIR: ${{ runner.temp }}/dbsphere-history-proof
        run: |
          printf 'PROOF_DIR=%s\nPG18_CONTAINER=%s\n' "$PROOF_DIR" "$PG18_CONTAINER" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_DIR"
          {
            uname -a
            nproc
            free -h
            lsblk -d -o NAME,TYPE,TRAN,ROTA,SIZE
            docker info --format 'docker_data_root={{.DockerRootDir}} storage_driver={{.Driver}}'
            df -h "$RUNNER_TEMP"
          } > "$PROOF_DIR/environment.txt"
          DBSPHERE_TEST_HISTORY_SCALE_PHASE=seed DBSPHERE_TEST_HISTORY_SCALE_OUTPUT="$PROOF_DIR/seed.json" \
            go test ./internal/store -run '^TestPG18HistoryCapacity$' -count=1 -timeout 27m -v
      - name: Clear PostgreSQL and runner page caches before cold queries
        run: |
          docker stop -t 60 "$PG18_CONTAINER"
          sync
          if printf '3\n' | sudo tee /proc/sys/vm/drop_caches >/dev/null; then
            printf '%s\n' 'PostgreSQL restarted and Linux page caches cleared' > "$PROOF_DIR/cold-scope.txt"
          else
            printf '%s\n' 'PostgreSQL restarted; Linux page caches retained' > "$PROOF_DIR/cold-scope.txt"
          fi
          docker start "$PG18_CONTAINER"
          for _ in $(seq 1 75); do
            if docker exec "$PG18_CONTAINER" pg_isready -h 127.0.0.1 -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Measure cold and warm history with five clients
        run: |
          DBSPHERE_TEST_HISTORY_SCALE_PHASE=measure DBSPHERE_TEST_HISTORY_SCALE_OUTPUT="$PROOF_DIR/measure.json" \
            go test ./internal/store -run '^TestPG18HistoryCapacity$' -count=1 -timeout 8m -v
      - name: Back up all samples and restore to a separate PostgreSQL database
        run: |
          archive="$RUNNER_TEMP/history-capacity.dump"
          started=$(date +%s%3N)
          docker exec "$PG18_CONTAINER" pg_dump -U postgres -Fc -Z3 postgres > "$archive"
          backed_up=$(date +%s%3N)
          docker exec "$PG18_CONTAINER" createdb -U postgres capacity_restore
          docker exec -i "$PG18_CONTAINER" pg_restore -U postgres --exit-on-error -d capacity_restore < "$archive"
          restored=$(date +%s%3N)
          printf 'backup_ms=%s\nrestore_ms=%s\nbackup_bytes=%s\n' "$((backed_up-started))" \
            "$((restored-backed_up))" "$(stat -c %s "$archive")" > "$PROOF_DIR/backup.txt"
          sha256sum "$archive" >> "$PROOF_DIR/backup.txt"
          DBSPHERE_TEST_HISTORY_SCALE_URL=postgres://postgres:dbsphere-scale-test@127.0.0.1:15434/capacity_restore \
            DBSPHERE_TEST_HISTORY_SCALE_PHASE=restore DBSPHERE_TEST_HISTORY_SCALE_OUTPUT="$PROOF_DIR/restore.json" \
            go test ./internal/store -run '^TestPG18HistoryCapacity$' -count=1 -timeout 5m -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbsphere-history-capacity
          path: ${{ runner.temp }}/dbsphere-history-proof
          if-no-files-found: warn

  collector-load:
    if: github.ref == 'refs/heads/development/v3.0' || startsWith(github.ref, 'refs/heads/release/v3.')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify 100 mixed assets, failure isolation, and collector takeover
        env:
          DBSPHERE_HOST: 127.0.0.1
          DBSPHERE_ADMIN_PASSWORD: dbsphere-load-admin-fixture
          DBSPHERE_LOAD_ADMIN_PASSWORD: dbsphere-load-admin-fixture
          DBSPHERE_LOAD_MONITOR_PASSWORD: dbsphere-load-monitor-fixture
          DBSPHERE_LOAD_BAD_PASSWORD: dbsphere-load-incorrect-fixture
          DBSPHERE_DATABASE_URL: postgres://postgres:dbsphere-load-test@127.0.0.1:15434/postgres?sslmode=disable
          DBSPHERE_ENABLE_GO_COLLECTOR: 'true'
          DBSPHERE_COLLECT_INTERVAL_SECONDS: '30'
          DBSPHERE_COLLECT_WORKERS: '8'
        run: |
          proof="$RUNNER_TEMP/dbsphere-collector-proof"
          mkdir -p "$proof"
          docker run -d --name dbsphere-load-history -p 15434:5432 \
            -e POSTGRES_PASSWORD=dbsphere-load-test postgres:18-bookworm
          for pg in 14 16 18; do
            port=$((15430 + pg))
            docker run -d --name "dbsphere-load-pg$pg" -p "$port:5432" \
              -e POSTGRES_PASSWORD=dbsphere-load-target postgres:$pg-bookworm \
              postgres -c shared_preload_libraries=pg_stat_statements
          done
          docker run -d --name dbsphere-load-mysql -p 127.0.0.1:33306:3306 \
            -e MYSQL_ROOT_PASSWORD=dbsphere-load-mysql-fixture mysql:8.4.13 --performance-schema=ON
          docker run -d --name dbsphere-load-redis -p 127.0.0.1:16379:6379 redis:7.2.17-alpine
          etcd_archive="$RUNNER_TEMP/etcd-v3.6.17-linux-amd64.tar.gz"
          curl -fsSL --retry 4 --retry-all-errors \
            https://github.com/etcd-io/etcd/releases/download/v3.6.17/etcd-v3.6.17-linux-amd64.tar.gz -o "$etcd_archive"
          printf '%s  %s\n' 5c6365e03d0c81f605458f3f9a115f6daaebca08d1fb42d3ab0f1a38fd30909c "$etcd_archive" | sha256sum -c -
          tar -xzf "$etcd_archive" -C "$RUNNER_TEMP" etcd-v3.6.17-linux-amd64/etcd
          "$RUNNER_TEMP/etcd-v3.6.17-linux-amd64/etcd" --name=load --data-dir="$RUNNER_TEMP/etcd-load" \
            --listen-client-urls=http://127.0.0.1:22379 --advertise-client-urls=http://127.0.0.1:22379 \
            --listen-peer-urls=http://127.0.0.1:22380 --initial-advertise-peer-urls=http://127.0.0.1:22380 \
            --initial-cluster=load=http://127.0.0.1:22380 >"$proof/etcd.log" 2>&1 &
          etcd_pid=$!
          trap 'kill "$etcd_pid" ${first:-} ${second:-} 2>/dev/null || true' EXIT
          for host in dbsphere-load-history dbsphere-load-pg14 dbsphere-load-pg16 dbsphere-load-pg18; do
            for attempt in $(seq 1 60); do
              docker exec "$host" pg_isready -h 127.0.0.1 -U postgres && break
              sleep 1
            done
            docker exec "$host" pg_isready -h 127.0.0.1 -U postgres
          done
          for pg in 14 16 18; do
            docker exec "dbsphere-load-pg$pg" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c \
              "CREATE EXTENSION pg_stat_statements; CREATE ROLE dbsphere_collector LOGIN PASSWORD 'dbsphere-load-monitor-fixture'; GRANT pg_monitor TO dbsphere_collector;"
          done
          for attempt in $(seq 1 90); do
            docker exec -e MYSQL_PWD=dbsphere-load-mysql-fixture dbsphere-load-mysql mysql -uroot -Nse 'SELECT 1' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec -e MYSQL_PWD=dbsphere-load-mysql-fixture dbsphere-load-mysql mysql -uroot -e \
            "CREATE DATABASE dbsphere_fixture; CREATE USER 'dbsphere_collector'@'%' IDENTIFIED BY 'dbsphere-load-monitor-fixture';
             GRANT SELECT ON performance_schema.* TO 'dbsphere_collector'@'%';
             CREATE USER 'dbsphere_limited'@'%' IDENTIFIED BY 'dbsphere-load-monitor-fixture';
             GRANT SELECT ON performance_schema.global_status TO 'dbsphere_limited'@'%';"
          docker exec dbsphere-load-redis redis-cli ACL SETUSER dbsphere_collector on '>dbsphere-load-monitor-fixture' '-@all' \
            +ping +hello +info +slowlog\|get +cluster\|info +cluster\|shards
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:22379/health
          go build -o "$RUNNER_TEMP/dbsphere" ./cmd/dbsphere
          export DBSPHERE_MASTER_KEY="$(openssl rand -base64 32)"
          DBSPHERE_PORT=18090 "$RUNNER_TEMP/dbsphere" >"$proof/collector-1.log" 2>&1 &
          first=$!
          curl -fsS --retry 35 --retry-connrefused --retry-delay 1 http://127.0.0.1:18090/readyz
          DBSPHERE_PORT=18091 "$RUNNER_TEMP/dbsphere" >"$proof/collector-2.log" 2>&1 &
          second=$!
          curl -fsS --retry 35 --retry-connrefused --retry-delay 1 http://127.0.0.1:18091/readyz
          jq -n --arg report "$proof/load.json" '{site:"http://127.0.0.1:18090",storeContainer:"dbsphere-load-history",
            mixed:true,assetCount:100,intervalSeconds:30,durationSeconds:120,report:$report,
            targets:(([14,16,18]|map({host:"127.0.0.1",port:(15430+.),container:("dbsphere-load-pg"+tostring)})) + [
              {host:"127.0.0.1",port:33306,runtime:"mysql",database:"dbsphere_fixture"},
              {host:"127.0.0.1",port:33306,runtime:"mysql",database:"dbsphere_fixture",username:"dbsphere_limited"},
              {host:"127.0.0.1",port:16379,runtime:"redis",database:"0"},
              {host:"127.0.0.1",port:22379,runtime:"etcd",database:"etcd",username:"monitor"}]),
            failureTargets:[{host:"127.0.0.1",port:18999},
              {host:"127.0.0.1",port:16379,runtime:"redis",database:"0",passwordEnv:"DBSPHERE_LOAD_BAD_PASSWORD"}]}' > "$proof/config.json"
          node scripts/drill-collector-load.mjs "$proof/config.json"
          kill -TERM "$first"
          wait "$first" || true
          first=
          jq '.site="http://127.0.0.1:18091"' "$proof/config.json" > "$proof/failover-config.json"
          node scripts/drill-collector-load.mjs "$proof/failover-config.json" failover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbsphere-collector-load-proof
          path: ${{ runner.temp }}/dbsphere-collector-proof
          if-no-files-found: warn
