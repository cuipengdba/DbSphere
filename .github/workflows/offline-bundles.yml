name: Offline bundles

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "v$version"
      - name: Build both Linux x86_64 offline bundles
        run: |
          bash scripts/build-offline-bundle.sh "$RUNNER_TEMP/dbsphere-bundles"
          bash scripts/build-node-offline-bundle.sh "$RUNNER_TEMP/dbsphere-bundles"
      - name: Verify packaged checksums
        run: |
          cd "$RUNNER_TEMP/dbsphere-bundles"
          sha256sum --check --strict ./*.sha256
      - name: Upload preview artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dbsphere-offline-linux-amd64
          path: ${{ runner.temp }}/dbsphere-bundles/*
          if-no-files-found: error
          retention-days: 7
      - name: Attach checksummed assets to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" "$RUNNER_TEMP"/dbsphere-bundles/* --clobber
